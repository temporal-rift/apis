openapi: 3.0.3
info:
  title: Temporal Rift — Projection API
  description: Per-player game state and shared game history queries
  version: 1.5.0

servers:
  - url: /

security:
  - bearerAuth: [ ]

tags:
  - name: Projection

paths:
  /api/v1/games/{gameId}/state:
    get:
      tags: [ Projection ]
      operationId: getGameState
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            Full current game state for the requesting player. The view is participant-scoped: public facts plus
            only the caller's earned and private state. `revision`/`lastUpdatedAt` are freshness markers for polling
            one game and never promise global or cross-topic event order. After reload or a failed submission the
            client SHALL refresh this view and retry at most once against the fresh era/round/deadline coordinates.
            Only entitled fields are serialized: exact probabilities appear solely in the caller's own
            `myRevealedIntel`, future or carry-forward weights never appear, and private score reasons beyond the
            published history shape are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGameStateResponse'
        '401':
          description: Missing, invalid, or expired bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: |
            Game not found, or the requesting player is not a participant of the game (game existence is
            never disclosed to non-participants).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/games/{gameId}/history:
    get:
      tags: [ Projection ]
      operationId: getGameHistory
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full era-by-era history of resolved outcomes and cascaded paradoxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameHistoryResponse'
        '401':
          description: Missing, invalid, or expired bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Game history not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Phase:
      type: string
      enum:
        - LOBBY
        - ERA_START
        - HAND_SELECTION
        - ACTION_ROUND_1
        - ACTION_ROUND_2
        - ACTION_ROUND_3
        - PARADOX_RESOLUTION
        - RESOLUTION
        - ERA_END
        - GAME_ENDED

    HandCard:
      type: object
      required: [ cardInstanceId, cardType, grade, isPlayableThisRound ]
      properties:
        cardInstanceId:
          type: string
          format: uuid
        cardType:
          type: string
        grade:
          $ref: '#/components/schemas/CardGrade'
        isPlayableThisRound:
          type: boolean
          description: >-
            Whether this card can be played in the current round. Scoped to the current round only — it can change
            as rounds advance without a new HandDealt event. Advisory only: the authoritative check is
            game-service's rejection of the submission.

    EventOutcome:
      type: object
      required: [ outcomeId, description ]
      properties:
        outcomeId:
          type: string
          format: uuid
        description:
          type: string

    ActiveEvent:
      type: object
      required: [ eventId, title, carryOverState, outcomes ]
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
        carryOverState:
          type: string
          enum: [ FRESH, CASCADED, STALLED ]
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/EventOutcome'

    PlayerInGame:
      type: object
      required: [ playerId, score, isConnected ]
      properties:
        playerId:
          type: string
          format: uuid
        playerName:
          type: string
          nullable: true
          description: Not populated until a later slice.
        score:
          type: integer
        isConnected:
          type: boolean
        faction:
          type: string
          nullable: true
          description: Null until FactionRevealed.

    ActionSummary:
      type: object
      required: [ playerId, skipped ]
      properties:
        playerId:
          type: string
          format: uuid
        actionCategory:
          type: string
          nullable: true
          description: Null when skipped is true.
        actionFamily:
          type: string
          nullable: true
          description: Null when skipped is true.
        skipped:
          type: boolean

    RoundSummary:
      type: object
      required: [ roundNumber, actionSummaries ]
      properties:
        roundNumber:
          type: integer
        actionSummaries:
          type: array
          items:
            $ref: '#/components/schemas/ActionSummary'

    ChainState:
      type: object
      required: [ status, length ]
      properties:
        status:
          type: string
          enum: [ ACTIVE, COMPLETED, BROKEN ]
        length:
          type: integer
          minimum: 0
          description: Current number of links in the chain.

    Deadlines:
      type: object
      description: >-
        Authoritative expiry timestamps owned by game-service. The projection copies them for recovery;
        the submission endpoints enforce them. All fields nullable; absent object means no deadline is
        currently known. On 409/422 the client SHALL refresh state and retry at most once against the fresh
        coordinate instead of retrying blindly.
      properties:
        handSelectionExpiresAt:
          type: string
          format: date-time
          nullable: true
        actionRoundExpiresAt:
          type: string
          format: date-time
          nullable: true
        paradoxResolutionExpiresAt:
          type: string
          format: date-time
          nullable: true

    PhaseContext:
      type: object
      required: [ declarationOpen, paradoxOpen ]
      properties:
        declarationOpen:
          type: boolean
          description: True while the public declaration window accepts Rally/Momentum before Action Round 1.
        paradoxOpen:
          type: boolean
          description: True while a paradox-resolution phase accepts reactive cards for the current era.
        paradoxIds:
          type: array
          description: Open paradox identifiers when paradoxOpen is true; absent otherwise.
          items:
            type: string
            format: uuid

    PublicBandOutcome:
      type: object
      required: [ outcomeId, band ]
      properties:
        outcomeId:
          type: string
          format: uuid
        band:
          type: string
          enum: [ LOW, MEDIUM, HIGH ]

    PublicBandEvent:
      type: object
      required: [ eventId, observedInRound, outcomes ]
      properties:
        eventId:
          type: string
          format: uuid
        observedInRound:
          type: integer
          minimum: 1
          description: Round whose close produced these bands, so clients can show observation age.
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/PublicBandOutcome'

    PublicDeclaration:
      type: object
      required: [ playerId, mode, targetEventId, targetOutcomeId, eraNumber ]
      properties:
        playerId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [ RALLY, MOMENTUM ]
        targetEventId:
          type: string
          format: uuid
        targetOutcomeId:
          type: string
          format: uuid
        eraNumber:
          type: integer
          minimum: 1

    ExposeSignature:
      type: object
      required: [ type, targetEventId ]
      properties:
        type:
          type: string
          enum: [ PUSH, SUPPRESS, SWING ]
        targetEventId:
          type: string
          format: uuid
        sourceOutcomeId:
          type: string
          format: uuid
        targetOutcomeId:
          type: string
          format: uuid

    ExposeFact:
      type: object
      required: [ activistPlayerId, targetPlayerId, roundNumber, behaviorChanged ]
      properties:
        activistPlayerId:
          type: string
          format: uuid
        targetPlayerId:
          type: string
          format: uuid
        roundNumber:
          type: integer
          minimum: 2
          maximum: 3
          description: 2 carries the exposed Round-1 signature; 3 reports whether behavior changed.
        signature:
          $ref: '#/components/schemas/ExposeSignature'
          description: The exposed Round-1 signature; present only for round 2 facts.
        behaviorChanged:
          type: boolean
          description: True when the target submitted a different qualifying signature in Round 3.

    MySubmission:
      type: object
      required: [ eraNumber, kind, status ]
      properties:
        eraNumber:
          type: integer
          minimum: 1
        roundNumber:
          type: integer
          nullable: true
          description: Action round for ordinary submissions; null for hand selection, declarations and paradox cards.
        kind:
          type: string
          enum: [ HAND_SELECTION, DECLARATION, ACTION, PARADOX_CARD ]
          description: Which accepted decision this entry recovers.
        status:
          type: string
          enum: [ ACCEPTED ]
        actionType:
          type: string
          nullable: true
          enum: [ CARD, SPECIAL ]
          description: Present for ACTION entries; identifies the caller's own accepted family without details.

    SpecialBudget:
      type: object
      required: [ specialAction, remainingUsesThisEra, remainingUsesThisGame ]
      properties:
        specialAction:
          type: string
          description: One of the caller's faction specials, including Seal when entitled.
        remainingUsesThisEra:
          type: integer
          minimum: 0
        remainingUsesThisGame:
          type: integer
          minimum: 0

    ObjectiveProgress:
      type: object
      required: [ faction, progressCount, threshold, objectiveMet ]
      description: >-
        The caller's own cumulative progress toward their faction objective, computed by the owning
        projection from consumed events. Scoped to the caller alone: no other player's counts, secret
        picks, or streak state is ever included. Absent until the owner computes it and while the caller
        has no assigned faction. Thresholds are owner-populated from the effective rules configuration;
        clients SHALL use the transmitted threshold rather than hard-coding a constant.
      properties:
        faction:
          type: string
          enum: [ ERASERS, PROPHETS, REVISIONISTS, WEAVERS, ACTIVISTS ]
          description: The caller's assigned faction; mirrors myFaction when present.
        progressCount:
          type: integer
          minimum: 0
          description: >-
            Caller-scoped cumulative progress. ERASERS: outcomes the caller annihilated. PROPHETS: events
            resolved as written. REVISIONISTS: eras the caller's secret outcome won. WEAVERS: current chain
            links (mirrors the public chain length). ACTIVISTS: current consecutive eras with a correct
            declaration. A stalled declaration breaks that streak. The owner computes streaks server-side so
            clients never reconstruct them from history.
        threshold:
          type: integer
          minimum: 1
          description: Progress count that satisfies the faction objective under the effective rules.
        objectiveMet:
          type: boolean
          description: True once progressCount has reached threshold at an era boundary.

    GameWinner:
      type: object
      required: [ playerId ]
      properties:
        playerId:
          type: string
          format: uuid
        faction:
          type: string
          nullable: true

    FinalScore:
      type: object
      required: [ playerId, score ]
      properties:
        playerId:
          type: string
          format: uuid
        score:
          type: integer

    GameResult:
      type: object
      required: [ endReason, winners, finalScores, revealBoundary ]
      description: >-
        Authoritative terminal facts, present only when phase is GAME_ENDED. Consistent with the scores
        and faction reveals already published; per-round private hands and intel remain caller-scoped even
        after the game ends.
      properties:
        endReason:
          type: string
          enum:
            - SCORE_THRESHOLD
            - TIMELINE_COLLAPSED
            - TIMELINE_STABILIZED
            - DECK_EXHAUSTED
            - RESOLUTION_FAILED
            - ALL_PLAYERS_ABANDONED
        winners:
          type: array
          items:
            $ref: '#/components/schemas/GameWinner'
        finalScores:
          type: array
          items:
            $ref: '#/components/schemas/FinalScore'
        revealBoundary:
          type: string
          enum: [ FACTIONS_AND_SCORES_PUBLIC ]
          description: >-
            Declares what is now safe for participants to show: winners, factions and final scores are public
            to participants; all other private scoping (own hands, own intel) is unchanged.

    PlayerGameStateResponse:
      type: object
      required: [ gameId, eraNumber, phase, myHand, myScore, myRevealedIntel, activeEvents, players ]
      properties:
        gameId:
          type: string
          format: uuid
        eraNumber:
          type: integer
        revision:
          type: integer
          minimum: 0
          description: >-
            Monotonic freshness marker for this game's projection. Clients SHALL use it only to detect
            staleness between polls of the same game (a larger value means a newer view) and SHALL NOT infer
            global or cross-topic event order from it. Absent until the owning service computes it; when absent,
            poll again rather than assuming the view is current.
        lastUpdatedAt:
          type: string
          format: date-time
          description: >-
            When this participant view was last advanced by its owner. Advisory for freshness display and
            controlled retry backoff only; never a promise of global event order.
        phase:
          $ref: '#/components/schemas/Phase'
        roundNumber:
          type: integer
          nullable: true
          description: >-
            Current round within the era when phase is an action round or paradox resolution; null otherwise.
            Coordinates with the eraNumber/roundNumber stale-state guards on submission endpoints.
        deadlines:
          $ref: '#/components/schemas/Deadlines'
        phaseContext:
          $ref: '#/components/schemas/PhaseContext'
        myFaction:
          type: string
          nullable: true
        myHand:
          type: array
          items:
            $ref: '#/components/schemas/HandCard'
        pendingHandSelection:
          $ref: '#/components/schemas/PendingHandSelection'
        myScore:
          type: integer
        mySpecialActions:
          type: array
          description: >-
            The authenticated player's static set of three faction special actions. Empty until a faction is
            assigned; availability is governed by game-service rules and is not represented here.
          items:
            type: string
        myJammedUntilRound:
          type: integer
          nullable: true
          description: >-
            Round through which the authenticated player's faction specials are blocked. Null when that player is
            not jammed; private to that player, cleared after the round passes, and never carried across an era
            boundary.
        myRevealedIntel:
          type: array
          description: >-
            Exact information this player has bought with Information cards in the current era. Always present and
            empty when none; entries are refreshed or replaced according to the reveal event that produced them.
          items:
            $ref: '#/components/schemas/RevealedIntel'
        activeEvents:
          type: array
          items:
            $ref: '#/components/schemas/ActiveEvent'
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerInGame'
        lastRoundSummary:
          allOf:
            - $ref: '#/components/schemas/RoundSummary'
          nullable: true
          description: The most recently completed action round summary, or null before the first round closes.
        publicBands:
          type: array
          description: >-
            Public approximate bands for the current era, once published after Action Round 2. Each entry carries
            the round it was observed in so clients can show its age. Exact probabilities never appear here;
            they remain scoped to the caller's own myRevealedIntel. Absent when not yet published; empty means
            known-none. Replaces (never duplicates) the preview once the adjusted publication supersedes it.
          items:
            $ref: '#/components/schemas/PublicBandEvent'
        declarations:
          type: array
          description: >-
            Public Rally/Momentum declarations of record for the current era. Mirrors only what was already
            broadcast to all participants; never a private submission. A stalled declaration fails in this era
            and does not remain a scoring bet on the event if it returns later.
          items:
            $ref: '#/components/schemas/PublicDeclaration'
        exposeFacts:
          type: array
          description: >-
            Public Expose outcomes for the current era: the exposed Round-1 signature and whether the target's
            behavior changed in Round 3. Contains no Round-3 signature.
          items:
            $ref: '#/components/schemas/ExposeFact'
        mySubmissions:
          type: array
          description: >-
            The caller's own accepted decisions (hand selection, declaration, ordinary and paradox submissions)
            for recovery after reload. Never includes another player's decisions, resolved or not.
          items:
            $ref: '#/components/schemas/MySubmission'
        mySpecialBudgets:
          type: array
          description: >-
            Remaining uses for the caller's own special actions, including per-era and game-wide budgets (for
            example Seal). Scoped to the caller alone; opponent availability is never exposed.
          items:
            $ref: '#/components/schemas/SpecialBudget'
        myObjectiveProgress:
          $ref: '#/components/schemas/ObjectiveProgress'
          description: >-
            The caller's own progress toward their faction objective, including per-era and streak-based
            objectives that history alone cannot reconstruct. Scoped to the caller alone.
        result:
          $ref: '#/components/schemas/GameResult'
        chain:
          allOf:
            - $ref: '#/components/schemas/ChainState'
          nullable: true
          description: >-
            The current Weaver chain's status and link count, identical for every participant. Null when no chain
            has been created yet, or after the game has ended. Never includes any player-identifying field, before
            or after FactionRevealed.

    DealtHandCard:
      type: object
      required: [ cardInstanceId, cardType, grade, dealSlot ]
      properties:
        cardInstanceId:
          type: string
          format: uuid
        cardType:
          type: string
        grade:
          $ref: '#/components/schemas/CardGrade'
        dealSlot:
          type: integer
          minimum: 1
          maximum: 7

    PendingHandSelection:
      type: object
      required: [ cards, requiredSelectionCount, expiresAt ]
      properties:
        cards:
          type: array
          description: The authenticated player's private pending deal, ordered by dealSlot.
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/DealtHandCard'
        requiredSelectionCount:
          type: integer
          enum: [ 5 ]
        expiresAt:
          type: string
          format: date-time

    RevealedIntel:
      type: object
      required: [ kind, observedInRound, eventId ]
      properties:
        kind:
          type: string
          enum: [ PROBABILITY, INFLUENCE, HAND_CARD ]
        observedInRound:
          type: integer
          minimum: 1
        eventId:
          type: string
          format: uuid
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/RevealedProbabilityOutcome'
        influencerPlayerIds:
          type: array
          items:
            type: string
            format: uuid
        targetPlayerId:
          type: string
          format: uuid
        revealedCards:
          type: array
          items:
            $ref: '#/components/schemas/RevealedHandCard'

    RevealedProbabilityOutcome:
      type: object
      required: [ outcomeId, probability, isAnnihilated, isSealed ]
      properties:
        outcomeId:
          type: string
          format: uuid
        probability:
          type: integer
        isAnnihilated:
          type: boolean
        isSealed:
          type: boolean

    RevealedHandCard:
      type: object
      required: [ cardInstanceId, cardType, grade ]
      properties:
        cardInstanceId:
          type: string
          format: uuid
        cardType:
          type: string
        grade:
          $ref: '#/components/schemas/CardGrade'

    CardGrade:
      $ref: '../shared/enums.yaml#/CardGrade'

    ResolvedOutcome:
      type: object
      required: [ eventId, title, winningOutcomeId, winningOutcomeDescription ]
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        winningOutcomeId:
          type: string
          format: uuid
        winningOutcomeDescription:
          type: string
          minLength: 1

    CascadedEvent:
      type: object
      required: [ eventId, title ]
      properties:
        eventId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1

    GameHistoryEra:
      type: object
      required: [ eraNumber, outcomes, paradoxesCascaded, myHand ]
      properties:
        eraNumber:
          type: integer
          minimum: 1
        outcomes:
          type: array
          description: Resolved outcomes in the corresponding EventsDrawn reveal order.
          items:
            $ref: '#/components/schemas/ResolvedOutcome'
        paradoxesCascaded:
          type: integer
          minimum: 0
        cascadedEvents:
          type: array
          description: >-
            Present when paradoxesCascaded is greater than zero; omitted when it is zero. Entries are in reveal order.
          minItems: 1
          items:
            $ref: '#/components/schemas/CascadedEvent'
        myHand:
          type: array
          description: >-
            Cards dealt to the authenticated caller for this era. Always present; empty when the caller has no
            recorded hand for the era. Never contains another player's cards.
          items:
            $ref: '#/components/schemas/DealtHandCard'

    GameHistoryResponse:
      type: object
      required: [ gameId, eras ]
      properties:
        gameId:
          type: string
          format: uuid
        eras:
          type: array
          description: Era histories ordered by ascending eraNumber.
          items:
            $ref: '#/components/schemas/GameHistoryEra'

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
          maxLength: 1024
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
          format: uri
          maxLength: 1024
