Faction:
  type: string
  enum: [ ERASERS, PROPHETS, REVISIONISTS, WEAVERS, ACTIVISTS ]

CardType:
  type: string
  enum: [ PUSH, SUPPRESS, SWING, AMPLIFY, INTERCEPT, SCAN, TRACE, DECOY, JAM, STALL, REDIRECT, NULLIFY, COLLIDE, STABILIZE, DETONATE ]

CardGrade:
  type: string
  enum: [ I, II, III ]

CardCategory:
  type: string
  enum: [ PROBABILITY_SHIFTER, INFORMATION, DISRUPTION, PARADOX ]

ActionFamily:
  type: string
  enum: [ CARD, SPECIAL ]

SpecialAction:
  type: string
  enum: [ ANNIHILATE, CORRUPT, CASCADE, FORESIGHT, SEAL, FULFILLMENT, REWRITE, MIMIC, OBSCURE, THREAD, TAPESTRY, REWEAVE, RALLY, EXPOSE, MOMENTUM ]

SpecialActionUnavailableReason:
  type: string
  enum: [ JAMMED, DECLARATION_WINDOW_ONLY, NOT_ELIGIBLE_THIS_ERA, NOT_ELIGIBLE_THIS_ROUND, GAME_BUDGET_EXHAUSTED, ERA_BUDGET_EXHAUSTED ]

ParadoxType:
  type: string
  enum: [ DEAD_HEAT, IMPOSSIBLE_ERASURE, CHAIN_CONFLICT ]

ProbabilityBand:
  type: string
  enum: [ LOW, MEDIUM, HIGH ]
