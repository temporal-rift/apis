asyncapi: 3.0.0
info:
  title: Timeline events
  version: 3.1.0
  description: Timeline service domain events published to timeline.events

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  timelineEvents:
    address: timeline.events
    messages:
      resolutionStarted:
        $ref: '#/components/messages/ResolutionStarted'
      probabilityStateCalculated:
        $ref: '#/components/messages/ProbabilityStateCalculated'
      probabilityStateRevealed:
        $ref: '#/components/messages/ProbabilityStateRevealed'
      adjustedBandsPublished:
        $ref: '#/components/messages/AdjustedBandsPublished'
      paradoxDetected:
        $ref: '#/components/messages/ParadoxDetected'
      paradoxResolutionPhaseStarted:
        $ref: '#/components/messages/ParadoxResolutionPhaseStarted'
      paradoxResolved:
        $ref: '#/components/messages/ParadoxResolved'
      paradoxCascaded:
        $ref: '#/components/messages/ParadoxCascaded'
      outcomeApplied:
        $ref: '#/components/messages/OutcomeApplied'
      eraResolutionCompleted:
        $ref: '#/components/messages/EraResolutionCompleted'
      chainLinkAdded:
        $ref: '#/components/messages/ChainLinkAdded'
      chainCompleted:
        $ref: '#/components/messages/ChainCompleted'
      chainBroken:
        $ref: '#/components/messages/ChainBroken'
      chainLinkInvalidated:
        $ref: '#/components/messages/ChainLinkInvalidated'
      threadRejected:
        $ref: '#/components/messages/ThreadRejected'
      specialRejected:
        $ref: '#/components/messages/SpecialRejected'
      chainProtectionArmed:
        $ref: '#/components/messages/ChainProtectionArmed'
      chainProtectionConsumed:
        $ref: '#/components/messages/ChainProtectionConsumed'
      chainReAnchored:
        $ref: '#/components/messages/ChainReAnchored'
      cascadeCarriedForward:
        $ref: '#/components/messages/CascadeCarriedForward'
      corruptInversionConfirmed:
        $ref: '#/components/messages/CorruptInversionConfirmed'
      resolutionFailed:
        $ref: '#/components/messages/ResolutionFailed'
      resolutionWarning:
        $ref: '#/components/messages/ResolutionWarning'

operations:
  publishResolutionStarted:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/resolutionStarted' } ]
  publishProbabilityStateCalculated:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/probabilityStateCalculated' } ]
  publishProbabilityStateRevealed:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/probabilityStateRevealed' } ]
  publishAdjustedBandsPublished:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/adjustedBandsPublished' } ]
  publishParadoxDetected:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/paradoxDetected' } ]
  publishParadoxResolutionPhaseStarted:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/paradoxResolutionPhaseStarted' } ]
  publishParadoxResolved:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/paradoxResolved' } ]
  publishParadoxCascaded:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/paradoxCascaded' } ]
  publishOutcomeApplied:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/outcomeApplied' } ]
  publishEraResolutionCompleted:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/eraResolutionCompleted' } ]
  publishChainLinkAdded:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainLinkAdded' } ]
  publishChainCompleted:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainCompleted' } ]
  publishChainBroken:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainBroken' } ]
  publishChainLinkInvalidated:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainLinkInvalidated' } ]
  publishThreadRejected:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/threadRejected' } ]
  publishSpecialRejected:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/specialRejected' } ]
  publishChainProtectionArmed:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainProtectionArmed' } ]
  publishChainProtectionConsumed:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainProtectionConsumed' } ]
  publishChainReAnchored:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/chainReAnchored' } ]
  publishCascadeCarriedForward:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/cascadeCarriedForward' } ]
  publishCorruptInversionConfirmed:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/corruptInversionConfirmed' } ]
  publishResolutionFailed:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/resolutionFailed' } ]
  publishResolutionWarning:
    action: send
    channel: { $ref: '#/channels/timelineEvents' }
    messages: [ { $ref: '#/channels/timelineEvents/messages/resolutionWarning' } ]

components:
  messages:
    ResolutionStarted:
      name: ResolutionStarted
      title: Resolution started
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ResolutionStartedPayload' }
    ProbabilityStateCalculated:
      name: ProbabilityStateCalculated
      title: Probability state calculated
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ProbabilityStateCalculatedPayload' }
    ProbabilityStateRevealed:
      name: ProbabilityStateRevealed
      title: Probability state revealed
      description: >-
        Private per-player reveal of the exact probability state bought with SCAN. The playerId payload field identifies
        the viewer who receives this message, not the player who caused the reveal. One message is emitted per scanned
        event; the message is never broadcast.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ProbabilityStateRevealedPayload' }
    AdjustedBandsPublished:
      name: AdjustedBandsPublished
      title: Adjusted bands published
      description: >-
        Band values with every applied modifier accounted for, superseding the game-events preview
        (BandedProbabilityPublished) for the same game and era. Consumers replace the preview on receipt.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/AdjustedBandsPublishedPayload' }
    ParadoxDetected:
      name: ParadoxDetected
      title: Paradox detected
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ParadoxDetectedPayload' }
    ParadoxResolutionPhaseStarted:
      name: ParadoxResolutionPhaseStarted
      title: Paradox resolution phase started
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ParadoxResolutionPhaseStartedPayload' }
    ParadoxResolved:
      name: ParadoxResolved
      title: Paradox resolved
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ParadoxResolvedPayload' }
    ParadoxCascaded:
      name: ParadoxCascaded
      title: Paradox cascaded
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ParadoxCascadedPayload' }
    OutcomeApplied:
      name: OutcomeApplied
      title: Outcome applied
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/OutcomeAppliedPayload' }
    EraResolutionCompleted:
      name: EraResolutionCompleted
      title: Era resolution completed
      description: >-
        The ordered terminal-resolution barrier for an era. It is emitted once after all individual
        OutcomeApplied and ParadoxCascaded facts for that era are durably produced. It is service
        coordination data and is not a standalone player notification.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/EraResolutionCompletedPayload' }
    ChainLinkAdded:
      name: ChainLinkAdded
      title: Chain link added
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainLinkAddedPayload' }
    ChainCompleted:
      name: ChainCompleted
      title: Chain completed
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainCompletedPayload' }
    ChainBroken:
      name: ChainBroken
      title: Chain broken
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainBrokenPayload' }
    ChainLinkInvalidated:
      name: ChainLinkInvalidated
      title: Chain link invalidated
      description: >-
        Public chain-progress fact: an ANNIHILATE removed a linked outcome that TAPESTRY did not protect,
        so that link is removed and the chain length decremented. The chain stays open for rebuilding.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainLinkInvalidatedPayload' }
    ThreadRejected:
      name: ThreadRejected
      title: Thread rejected
      description: >-
        Private rejection of one THREAD play: an invalid current-era source, a past target that never resolved
        as claimed, or a missing coordinate. The playerId payload field identifies the viewer who receives this
        message. Chain length does not change and the message is never broadcast.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ThreadRejectedPayload' }
    SpecialRejected:
      name: SpecialRejected
      title: Special action rejected
      description: >-
        Private rejection of one TAPESTRY, REWEAVE, or CASCADE play whose prerequisites were not met (an
        unmet chain-length/era-budget prerequisite, an invalid or already-linked re-anchor target, or an
        un-erased CASCADE precondition). The playerId payload field identifies the viewer who receives this
        message; the message is never broadcast.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/SpecialRejectedPayload' }
    ChainProtectionArmed:
      name: ChainProtectionArmed
      title: Chain protection armed
      description: >-
        Private confirmation that an accepted TAPESTRY armed protection for the acting Weaver's chain for the
        remainder of the era it was played in. The playerId payload field identifies the viewer who receives
        this message; the message is never broadcast.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainProtectionArmedPayload' }
    ChainProtectionConsumed:
      name: ChainProtectionConsumed
      title: Chain protection consumed
      description: >-
        Private confirmation that an armed TAPESTRY protection absorbed an erasure that would otherwise have
        invalidated the identified link, and is no longer armed. The playerId payload field identifies the
        viewer who receives this message; the message is never broadcast.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainProtectionConsumedPayload' }
    ChainReAnchored:
      name: ChainReAnchored
      title: Chain re-anchored
      description: >-
        Public chain-progress fact: an accepted REWEAVE discarded the chain's newest link and replaced it with
        a different resolved past outcome, leaving chain length unchanged.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ChainReAnchoredPayload' }
    CascadeCarriedForward:
      name: CascadeCarriedForward
      title: Cascade carried forward
      description: >-
        Public fact: a CASCADE armed against an outcome erased in the prior era re-applied that erasure to the
        same outcome at the start of this era. Applied at most once per armed CASCADE.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/CascadeCarriedForwardPayload' }
    CorruptInversionConfirmed:
      name: CorruptInversionConfirmed
      title: Corrupt inversion confirmed
      description: >-
        Confirms, once a round's priority-ordered resolution has run, whether a CORRUPT's inversion of its
        correlated PUSH/SUPPRESS/SWING actually took effect (tookEffect true) or was voided by a same-round
        SEAL on the correlated card's target outcome (tookEffect false). game-service's scoring module
        consumes this to credit CORRUPTED_OPPONENT_CARD only when tookEffect is true.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/CorruptInversionConfirmedPayload' }
    ResolutionFailed:
      name: ResolutionFailed
      title: Resolution failed
      description: >-
        A FutureEvent's outcome probabilities did not sum to 100 after a round's priority-ordered actions
        were applied — a programming-error class of bug, not an expected runtime path. game-service's EraSaga consumes this to publish its own EraFailed
        (reason "resolution-failed") and trigger GameEndedAbnormally; timeline-service does not publish
        either of those itself, since both belong to session-event's contract.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ResolutionFailedPayload' }
    ResolutionWarning:
      name: ResolutionWarning
      title: Resolution warning
      description: >-
        A non-fatal anomaly during priority-ordered resolution was resolved deterministically (last-write-
        wins) rather than failing the era — currently only an identical-occurredAt tie between two
        remaining-tier actions in the same round. Informational; no consumer reaction is required.
      headers: { $ref: '#/components/schemas/EventEnvelopeHeaders' }
      payload: { $ref: '#/components/schemas/ResolutionWarningPayload' }

  schemas:
    EventEnvelopeHeaders:
      $ref: './shared/envelope-headers.yaml#/EventEnvelopeHeaders'

    ResolutionStartedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
      required: [ gameId, eraNumber ]

    ProbabilityStateCalculatedOutcomeState:
      type: object
      properties:
        outcomeId: { type: string, format: uuid }
        probability: { type: integer }
        isAnnihilated: { type: boolean }
        isSealed: { type: boolean }
      required: [ outcomeId, probability, isAnnihilated, isSealed ]

    ProbabilityStateCalculatedEventState:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/ProbabilityStateCalculatedOutcomeState' }
      required: [ eventId, outcomes ]

    ProbabilityStateCalculatedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        eventStates:
          type: array
          items: { $ref: '#/components/schemas/ProbabilityStateCalculatedEventState' }
      required: [ gameId, eraNumber, eventStates ]

    ProbabilityStateRevealedOutcomeState:
      type: object
      properties:
        outcomeId: { type: string, format: uuid }
        probability: { type: integer }
        isAnnihilated: { type: boolean }
        isSealed: { type: boolean }
      required: [ outcomeId, probability, isAnnihilated, isSealed ]

    ProbabilityStateRevealedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        roundNumber: { type: integer }
        playerId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/ProbabilityStateRevealedOutcomeState' }
      required: [ gameId, eraNumber, roundNumber, playerId, eventId, outcomes ]

    ProbabilityBand:
      $ref: './shared/enums.yaml#/ProbabilityBand'

    AdjustedBandsPublishedOutcomeBandState:
      type: object
      properties:
        outcomeId: { type: string, format: uuid }
        band: { $ref: '#/components/schemas/ProbabilityBand' }
      required: [ outcomeId, band ]

    AdjustedBandsPublishedEventBandState:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/AdjustedBandsPublishedOutcomeBandState' }
      required: [ eventId, outcomes ]

    AdjustedBandsPublishedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        eventStates:
          type: array
          items: { $ref: '#/components/schemas/AdjustedBandsPublishedEventBandState' }
      required: [ gameId, eraNumber, eventStates ]

    ParadoxType:
      $ref: './shared/enums.yaml#/ParadoxType'

    SpecialAction:
      $ref: './shared/enums.yaml#/SpecialAction'

    ParadoxDetectedParadox:
      type: object
      properties:
        paradoxId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ParadoxType' }
        affectedEventId: { type: string, format: uuid }
        affectedOutcomeIds:
          type: array
          items: { type: string, format: uuid }
        description: { type: string }
      required: [ paradoxId, type, affectedEventId, affectedOutcomeIds, description ]

    ParadoxDetectedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        paradoxes:
          type: array
          items: { $ref: '#/components/schemas/ParadoxDetectedParadox' }
      required: [ gameId, eraNumber, paradoxes ]

    ParadoxResolutionPhaseStartedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        paradoxIds:
          type: array
          items: { type: string, format: uuid }
        timerSeconds: { type: integer }
      required: [ gameId, eraNumber, paradoxIds, timerSeconds ]

    ParadoxResolvedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        paradoxId: { type: string, format: uuid }
        resolvedByPlayerId: { type: string, format: uuid }
      required: [ gameId, eraNumber, paradoxId, resolvedByPlayerId ]

    ParadoxCascadedProbabilityState:
      type: object
      properties:
        outcomeId: { type: string, format: uuid }
        probability: { type: integer }
      required: [ outcomeId, probability ]

    ParadoxCascadedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        paradoxId: { type: string, format: uuid }
        affectedEventId: { type: string, format: uuid }
        carryForwardProbabilityState:
          type: array
          items: { $ref: '#/components/schemas/ParadoxCascadedProbabilityState' }
        detonatedByPlayerIds:
          description: >-
            Player ids whose DETONATE targeted this cascade (GDD "Group 4 — Paradox"). Empty when no DETONATE
            was submitted for this event. Multiple DETONATEs on the same event collapse into this one set —
            the effect does not stack. Consumers apply their own scoring multiplier; this field is a fact,
            not a computed score.
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          default: [ ]
      required: [ gameId, eraNumber, paradoxId, affectedEventId, carryForwardProbabilityState ]

    OutcomeAppliedProbabilityState:
      type: object
      properties:
        outcomeId: { type: string, format: uuid }
        probability: { type: integer }
      required: [ outcomeId, probability ]

    OutcomeAppliedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        eventId: { type: string, format: uuid }
        winningOutcomeId: { type: string, format: uuid }
        finalProbabilities:
          type: array
          items: { $ref: '#/components/schemas/OutcomeAppliedProbabilityState' }
      required: [ gameId, eraNumber, eventId, winningOutcomeId, finalProbabilities ]

    EraResolutionTerminalState:
      type: string
      enum: [ OUTCOME_APPLIED, CASCADED, STALLED ]

    EraTerminalResolution:
      description: >-
        One terminal result. revealIndex is the zero-based index of eventId in the source
        EventsDrawn.events list. The terminalResolutions array MUST use those same ascending indexes.
      oneOf:
        - type: object
          description: A resolved event with its winning outcome.
          properties:
            eventId: { type: string, format: uuid }
            revealIndex: { type: integer, minimum: 0 }
            terminalState: { type: string, const: OUTCOME_APPLIED }
            winningOutcomeId: { type: string, format: uuid }
          required: [ eventId, revealIndex, terminalState, winningOutcomeId ]
        - type: object
          description: A cascaded event, which has no winning outcome.
          properties:
            eventId: { type: string, format: uuid }
            revealIndex: { type: integer, minimum: 0 }
            terminalState: { type: string, const: CASCADED }
          required: [ eventId, revealIndex, terminalState ]
          not:
            required: [ winningOutcomeId ]
        - type: object
          description: >-
            A STALL-delayed event, carried into the next era instead of resolving this era. Distinct from
            CASCADED: an ordinary disruption card, not a paradox — consumers must not treat it as
            paradox-collapse pressure.
          properties:
            eventId: { type: string, format: uuid }
            revealIndex: { type: integer, minimum: 0 }
            terminalState: { type: string, const: STALLED }
          required: [ eventId, revealIndex, terminalState ]
          not:
            required: [ winningOutcomeId ]

    EraResolutionCompletedPayload:
      type: object
      description: >-
        Contains every active event for the era exactly once, in the EventsDrawn.events reveal order,
        including carried-over events. Each revealIndex MUST equal the entry's zero-based source-list index,
        and the array MUST use those indexes in ascending order. Producers and consumers validate these
        invariants; JSON Schema cannot compare this message to the separate EventsDrawn payload. Consumers
        use this barrier rather than individual cascade arrival order to determine timeline collapse and
        completed scoring input.
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        terminalResolutions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EraTerminalResolution' }
      required: [ gameId, eraNumber, terminalResolutions ]

    ChainLinkAddedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        chainId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        sourceEventId:
          type: string
          format: uuid
          description: The current-era event this link was anchored from (the THREAD's own-era side).
        sourceOutcomeId:
          type: string
          format: uuid
          description: The current-era outcome this link was anchored from.
        linkedEventId: { type: string, format: uuid }
        linkedOutcomeId: { type: string, format: uuid }
        chainLength: { type: integer }
        previousLinkEventId: { type: string, format: uuid }
      required: [ gameId, chainId, playerId, linkedEventId, linkedOutcomeId, chainLength ]

    ChainCompletedChainLink:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        outcomeId: { type: string, format: uuid }
        eraNumber: { type: integer }
      required: [ eventId, outcomeId, eraNumber ]

    ChainCompletedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        chainId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        links:
          type: array
          items: { $ref: '#/components/schemas/ChainCompletedChainLink' }
      required: [ gameId, eraNumber, chainId, playerId, links ]

    ChainBrokenPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        chainId: { type: string, format: uuid }
        brokenByPlayerId: { type: string, format: uuid }
        targetPlayerId: { type: string, format: uuid }
        chainLengthAtBreak: { type: integer }
      required: [ gameId, eraNumber, chainId, brokenByPlayerId, targetPlayerId, chainLengthAtBreak ]

    ChainLinkInvalidatedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        chainId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        invalidatedEventId: { type: string, format: uuid }
        invalidatedOutcomeId: { type: string, format: uuid }
        chainLength: { type: integer }
      required:
        [ gameId, eraNumber, chainId, playerId, invalidatedEventId, invalidatedOutcomeId, chainLength ]

    ThreadRejectedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        eraNumber: { type: integer }
        chainId: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        sourceEventId:
          type: string
          format: uuid
          description: The submitted current-era source, when the rejection is source-side. Absent otherwise.
