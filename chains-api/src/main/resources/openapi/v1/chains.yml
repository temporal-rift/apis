openapi: 3.0.3
info:
  title: Temporal Rift — Chains API
  description: Gated Weaver chain reads for timeline-service
  version: 1.0.0

servers:
  - url: /

security:
  - bearerAuth: [ ]

tags:
  - name: Chains

paths:
  /api/v1/games/{gameId}/chains:
    get:
      tags: [ Chains ]
      operationId: getChain
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requesting Weaver's own chain state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainResponse'
        '401':
          description: Missing, invalid, or expired bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: |
            Requesting player is not the Weavers faction (`code: 403-01`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: |
            Game not found, or the requesting player is not a participant of the game
            (`code: 404-01`, game existence is never disclosed to non-participants),
            or the requesting Weaver has no chain yet (`code: 404-02`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChainStatus:
      type: string
      enum:
        - ACTIVE
        - COMPLETED
        - BROKEN

    ChainLink:
      type: object
      required: [ eventId, outcomeId, eraNumber ]
      properties:
        eventId:
          type: string
          format: uuid
        outcomeId:
          type: string
          format: uuid
        eraNumber:
          type: integer

    ChainResponse:
      type: object
      required: [ chainId, status, chainLength, links ]
      properties:
        chainId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ChainStatus'
        chainLength:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/ChainLink'

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
          maxLength: 1024
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        title:
          type: string
          description: A short, human-readable summary of the problem type. It should not change from occurrence to occurrence of the problem, except for purposes of localization.
          maxLength: 1024
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          maxLength: 4096
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          maxLength: 1024
        code:
          type: string
          description: An API specific error code aiding the provider team understand the error based on their own potential taxonomy or registry.
          maxLength: 50
        errors:
          type: array
          description: An array of error details to accompany a problem details response.
          maxItems: 1000
          items:
            type: object
            description: An object to provide explicit details on a problem towards an API consumer.
            properties:
              detail:
                type: string
                description: A granular description on the specific error related to a body property, query parameter, path parameters, and/or header.
                maxLength: 4096
              pointer:
                type: string
                description: A JSON Pointer to a specific request body property that is the source of error.
                maxLength: 1024
              parameter:
                type: string
                description: The name of the query or path parameter that is the source of error.
                maxLength: 1024
              header:
                type: string
                description: The name of the header that is the source of error.
                maxLength: 1024
              code:
                type: string
                description: A string containing additional provider specific codes to identify the error context.
                maxLength: 50
            required:
              - detail
      required:
        - detail
