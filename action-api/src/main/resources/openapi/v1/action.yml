openapi: 3.0.3
info:
  title: Temporal Rift — Action API
  description: Action round and paradox-resolution submission endpoints
  version: 3.3.0

servers:
  - url: /

security:
  - bearerAuth: [ ]

tags:
  - name: Action

paths:
  /api/v1/games/{gameId}/eras/{eraNumber}/hand-selection:
    post:
      tags: [ Action ]
      operationId: selectHand
      description: |
        Selects the five cards that become the authenticated player's playable hand from that player's open,
        seven-card current-era deal. The selection window is established by the private HandDealt event and ends at
        its selectionExpiresAt timestamp.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandSelectionRequest'
      responses:
        '202':
          description: Hand selection accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandSelectionResponse'
        '409':
          description: |
            The hand-selection window is not open or has expired (`code: 409-08`), or the player's hand selection
            was already resolved (`code: 409-09`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            Invalid selection: one or more identifiers do not belong to the authenticated player's open seven-card
            deal (`code: 422-11`). The request schema requires exactly five distinct identifiers.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/games/{gameId}/eras/{eraNumber}/declarations:
    post:
      tags: [ Action ]
      operationId: recordActivistDeclaration
      description: |
        Records the Activist's sole current-era Rally or eligible Momentum declaration during the public declaration
        window after event reveal and before Action Round 1 opens. It consumes that player's Round-1 special-action
        slot; this is not a free declaration action. The target event and outcome must be active in the current era.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivistDeclarationRequest'
      responses:
        '202':
          description: Public declaration recorded and the Round-1 special-action slot consumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivistDeclarationResponse'
        '409':
          description: |
            Declaration window closed (`code: 409-03`) or a declaration/action-round-1 special submission already
            exists (`code: 409-04`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            Invalid declaration:
            - Player jammed (`code: 422-02`)
            - Faction required (`code: 422-04`)
            - Player is not an Activist (`code: 422-05`)
            - Target event or outcome does not belong to the current game/era (`code: 422-06`)
            - Momentum is not eligible (`code: 422-08`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/games/{gameId}/eras/{eraNumber}/rounds/{roundNumber}/actions:
    post:
      tags: [ Action ]
      operationId: submitAction
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: roundNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActionRequest'
      responses:
        '202':
          description: Action submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitActionResponse'
        '409':
          description: |
            Round already closed (`code: 409-01`), player already submitted (`code: 409-02`), Expose was already
            used in this era (`code: 409-05`), or a once-per-era-budgeted special action was already used in this
            era (`code: 409-10`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            Validation error:
            - Card not in hand (`code: 422-01`)
            - Player jammed (`code: 422-02`)
            - Invalid target (`code: 422-03`)
            - Faction required for special action (`code: 422-04`)
            - Faction does not own the submitted special action (`code: 422-05`)
            - Target event or outcome does not belong to the current game/era (`code: 422-06`)
            - Rally or Momentum submitted outside the declaration endpoint (`code: 422-07`)
            - Expose is not available in this round or its target player is not eligible (`code: 422-09`)
            - Card type is not eligible during an action round (`code: 422-10`)
            - Card or special action cannot be played in this era or round, including Trace in Era 1 Round 1 and
              Stall or Cascade in the final era, which has no next era (`code: 422-12`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/games/{gameId}/eras/{eraNumber}/paradox-resolution/actions:
    post:
      tags: [ Action ]
      operationId: submitParadoxResolutionCard
      description: |
        Submits the authenticated player's single card for an open paradox-resolution phase. This phase is scoped to
        the era rather than an action round, so the operation has no roundNumber. The server validates phase state,
        card ownership and eligibility, target membership, and whether the player already submitted.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParadoxResolutionCardRequest'
      responses:
        '202':
          description: Paradox-resolution card submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParadoxResolutionCardResponse'
        '409':
          description: |
            Paradox-resolution phase is not open for the requested game and era (`code: 409-06`), or the player
            already submitted during that phase (`code: 409-07`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            Validation error:
            - Card not in hand (`code: 422-01`)
            - Target event or outcome does not belong to the current game/era (`code: 422-06`)
            - Card type is not eligible during paradox resolution (`code: 422-10`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/games/{gameId}/eras/{eraNumber}/rounds/{roundNumber}/status:
    get:
      tags: [ Action ]
      operationId: getRoundStatus
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: roundNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: |
            Round submission status. `pendingPlayerIds` reports who has not submitted, never what anyone
            submitted. The optional caller-scoped `mySubmission` recovers the caller's own accepted decision
            after reload; it never carries another player's choice. Era/round coordinates are stale-state
            guards: refresh the participant state and retry at most once when they are rejected elsewhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundStatusResponse'
        '404':
          description: |
            Game or round not found (`code: 404-01`). Also returned when the requesting player is
            not a participant of the game, so game and round existence is never disclosed to
            outsiders.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/games/{gameId}/eras/{eraNumber}/paradox-resolution/status:
    get:
      tags: [ Action ]
      operationId: getParadoxResolutionStatus
      description: |
        Recovers the current paradox-resolution phase for the caller's era: whether reactive offers are open,
        the authoritative deadline, aggregate submission progress, the caller's own submission flag, the
        current phase's affected events, and the caller's own eligible resolution cards. Phase-scoped to
        the era, so there is no roundNumber; the explicit eraNumber is a stale-state guard. The response
        carries only the caller's own choices and offers and never another participant's; closed or expired
        phases expose no active offers.
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eraNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paradox-resolution phase status with caller-scoped submission and choice recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParadoxResolutionStatusResponse'
        '404':
          description: |
            Game or paradox-resolution phase not found (`code: 404-01`). Also returned when the requesting
            player is not a participant of the game, so game and phase existence is never disclosed to
            outsiders.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ActionType:
      type: string
      enum: [ CARD, SPECIAL ]

    SpecialAction:
      $ref: '../shared/enums.yaml#/SpecialAction'

    CardType:
      $ref: '../shared/enums.yaml#/CardType'

    CardGrade:
      $ref: '../shared/enums.yaml#/CardGrade'

    ActionSubmissionStatus:
      type: string
      enum: [ SUBMITTED ]

    RoundStatus:
      type: string
      enum: [ OPEN, CLOSED ]

    HandSelectionStatus:
      type: string
      enum: [ SELECTED ]

    HandSelectionRequest:
      type: object
      required: [ keptCardInstanceIds ]
      properties:
        keptCardInstanceIds:
          type: array
          description: Exactly five distinct cards from the authenticated player's pending seven-card deal.
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            format: uuid

    HandSelectionResponse:
      type: object
      required: [ gameId, eraNumber, playerId, status ]
      properties:
        gameId:
          type: string
          format: uuid
        eraNumber:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/HandSelectionStatus'

    SubmitActionRequest:
      type: object
      required: [ actionType ]
      properties:
        actionType:
          $ref: '#/components/schemas/ActionType'
      discriminator:
        propertyName: actionType
        mapping:
          CARD: '#/components/schemas/CardActionRequest'
          SPECIAL: '#/components/schemas/SpecialActionRequest'

    CardActionRequest:
      allOf:
        - $ref: '#/components/schemas/SubmitActionRequest'
        - type: object
          required: [ cardInstanceId ]
          properties:
            cardInstanceId:
              type: string
              format: uuid
            targetEventId:
              type: string
              format: uuid
              description: >-
                Required for scalar-event-targeting card types; must be omitted for SCAN and player-targeting types
                (NULLIFY, REDIRECT, AMPLIFY, JAM, INTERCEPT).
            targetEventIds:
              type: array
              nullable: true
              minItems: 1
              maxItems: 3
              items:
                type: string
                format: uuid
              description: >-
                A one-to-three item event selection, distinct by convention though not schema-enforced (see below).
                It must be the sole target mode and cannot be combined with scalar event, player, or outcome
                targets. game-service validates distinctness and card-specific list semantics after resolving
                cardInstanceId.
            sourceOutcomeId:
              type: string
              format: uuid
              description: >-
                Required when the submitted card resolves as SWING and must differ from targetOutcomeId; must be
                omitted for player-targeting card types (NULLIFY, REDIRECT, AMPLIFY, JAM, INTERCEPT).
            targetOutcomeId:
              type: string
              format: uuid
              description: >-
                Required for event-targeting card submissions, and for SWING must differ from sourceOutcomeId;
                must be omitted for player-targeting card types (NULLIFY, REDIRECT, AMPLIFY, JAM, INTERCEPT) — it
                only identifies an outcome of a targeted event, which those types don't have.
            targetPlayerId:
              type: string
              format: uuid
              description: >-
                Required for player-targeting card types (NULLIFY, REDIRECT, AMPLIFY, JAM, INTERCEPT); must be
                omitted for every other card type. Must name a participant in the game other than the submitting
                player.
          oneOf:
            - required: [ targetEventId ]
              not:
                anyOf:
                  - required: [ targetEventIds ]
                  - required: [ targetPlayerId ]
            - required: [ targetEventIds ]
              not:
                anyOf:
                  - required: [ targetEventId ]
                  - required: [ targetPlayerId ]
                  - required: [ sourceOutcomeId ]
                  - required: [ targetOutcomeId ]
            - required: [ targetPlayerId ]
              not:
                anyOf:
                  - required: [ targetEventId ]
                  - required: [ targetEventIds ]
                  - required: [ sourceOutcomeId ]
                  - required: [ targetOutcomeId ]

    SpecialActionRequest:
      allOf:
        - $ref: '#/components/schemas/SubmitActionRequest'
        - type: object
          required: [ specialAction ]
          properties:
            specialAction:
              $ref: '#/components/schemas/SpecialAction'
              description: |
                Rally and Momentum are accepted only by the declaration endpoint during the pre-Round-1 declaration
                window. Corrupt and Expose are player-targeting: both require targetPlayerId and must omit
                targetEventId and targetOutcomeId. Every other special action, including Thread, requires
                targetEventId and targetOutcomeId and must omit targetPlayerId. Thread's target names the
                not-yet-resolved current-era outcome it anchors as the chain's next link; sourceEventId and
                sourceOutcomeId are never used for special actions and must always be omitted.
            sourceEventId:
              type: string
              format: uuid
              description: >-
                Unused for special actions; must always be omitted. Present only for schema symmetry with
                CardActionRequest.
            sourceOutcomeId:
              type: string
              format: uuid
              description: >-
                Unused for special actions; must always be omitted. Present only for schema symmetry with
                CardActionRequest.
            targetEventId:
              type: string
              format: uuid
              description: >-
                Required for event-targeting special actions (including Thread); must be omitted for Corrupt and
                Expose.
            targetOutcomeId:
              type: string
              format: uuid
              description: >-
                Required for event-targeting special actions (including Thread); must be omitted for Corrupt and
                Expose.
            targetPlayerId:
              type: string
              format: uuid
              description: >-
                Required for player-targeting special actions (Corrupt, Expose); must be omitted for every other
                special action.

    ActivistDeclarationMode:
      type: string
      enum: [ RALLY, MOMENTUM ]

    ActivistDeclarationRequest:
      type: object
      required: [ specialAction, targetEventId, targetOutcomeId ]
      properties:
        specialAction:
          $ref: '#/components/schemas/ActivistDeclarationMode'
        targetEventId:
          type: string
          format: uuid
          description: An active current-era event.
        targetOutcomeId:
          type: string
          format: uuid
          description: An available outcome belonging to targetEventId.

    ActivistDeclarationResponse:
      type: object
      required: [ gameId, eraNumber, playerId, specialAction, targetEventId, targetOutcomeId, status ]
      properties:
        gameId:
          type: string
          format: uuid
        eraNumber:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        specialAction:
          $ref: '#/components/schemas/ActivistDeclarationMode'
        targetEventId:
          type: string
          format: uuid
        targetOutcomeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ DECLARED ]

    ParadoxResolutionCardRequest:
      type: object
      required: [ cardInstanceId, targetEventId, targetOutcomeId ]
      properties:
        cardInstanceId:
          type: string
          format: uuid
        targetEventId:
          type: string
          format: uuid
          description: An event affected by the currently open paradox-resolution phase.
        targetOutcomeId:
          type: string
          format: uuid
          description: An outcome belonging to targetEventId; event-targeted cards may ignore it.

    ParadoxResolutionCardResponse:
      type: object
      required: [ gameId, eraNumber, playerId, status ]
      properties:
        gameId:
          type: string
          format: uuid
        eraNumber:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ActionSubmissionStatus'

    SubmitActionResponse:
      type: object
      required: [ gameId, eraNumber, roundNumber, playerId, status, roundClosed ]
      properties:
        gameId:
          type: string
          format: uuid
        eraNumber:
          type: integer
          minimum: 1
        roundNumber:
          type: integer
          minimum: 1
        playerId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ActionSubmissionStatus'
        roundClosed:
          type: boolean

    RoundStatusResponse:
      type: object
      required: [ eraNumber, roundNumber, status, timerRemainingSeconds, submittedCount, totalPlayers, pendingPlayerIds ]
      properties:
        eraNumber:
          type: integer
          minimum: 1
        roundNumber:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RoundStatus'
        timerRemainingSeconds:
          type: integer
          minimum: 0
        submittedCount:
          type: integer
        totalPlayers:
          type: integer
        pendingPlayerIds:
          type: array
          items:
            type: string
            format: uuid
        mySubmission:
          $ref: '#/components/schemas/MyRoundSubmission'

    MyRoundSubmission:
      type: object
      required: [ submitted ]
      description: >-
        Caller-scoped recovery of the caller's own accepted round decision. Absent until the owner computes
        it; never carries another player's choice, resolved or not.
      properties:
        submitted:
          type: boolean
        actionType:
          $ref: '#/components/schemas/ActionType'
          description: The caller's own accepted family when submitted is true; absent otherwise.

    ParadoxResolutionStatusResponse:
      type: object
      required: [ eraNumber, phaseOpen, submittedCount, totalPlayers, mySubmitted ]
      properties:
        eraNumber:
          type: integer
          minimum: 1
        phaseOpen:
          type: boolean
          description: True while the era's paradox-resolution phase accepts reactive cards.
        timerRemainingSeconds:
          type: integer
          minimum: 0
          description: Authoritative seconds remaining while phaseOpen is true; absent once closed.
        submittedCount:
          type: integer
          minimum: 0
        totalPlayers:
          type: integer
          minimum: 0
        pendingPlayerIds:
          type: array
          description: Players yet to submit while the phase is open; never reveals submitted card details.
          items:
            type: string
            format: uuid
        mySubmitted:
          type: boolean
          description: Whether the caller has an accepted paradox-resolution submission for this era.
        affectedEventIds:
          type: array
          description: >-
            Identifiers of the events affected by the current paradox-resolution phase. Present while the
            phase is known; sufficient with eligibleResolutionCards to form a valid, reload-safe choice.
          items:
            type: string
            format: uuid
        eligibleResolutionCards:
          type: array
          description: >-
            The caller's own eligible resolution cards for the current open phase. Present only while the
            phase is open and the caller has not yet submitted; absent once the phase is closed or expired
            and never carries another participant's choices or offers.
          items:
            $ref: '#/components/schemas/EligibleResolutionCard'

    EligibleResolutionCard:
      type: object
      required: [ cardInstanceId, cardType, grade ]
      description: >-
        One of the caller's own cards eligible for the current open paradox-resolution phase. Caller-scoped:
        never carries another participant's card.
      properties:
        cardInstanceId:
          type: string
          format: uuid
        cardType:
          $ref: '#/components/schemas/CardType'
        grade:
          $ref: '#/components/schemas/CardGrade'

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          format: uri
          maxLength: 1024
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          format: int32
          minimum: 100
          maximum: 599
        title:
          type: string
          description: A short, human-readable summary of the problem type. It should not change from occurrence to occurrence of the problem, except for purposes of localization.
          maxLength: 1024
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          maxLength: 4096
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          maxLength: 1024
        code:
          type: string
          description: An API specific error code aiding the provider team understand the error based on their own potential taxonomy or registry.
          maxLength: 50
        errors:
          type: array
          description: An array of error details to accompany a problem details response.
          maxItems: 1000
          items:
            type: object
            description: An object to provide explicit details on a problem towards an API consumer.
            properties:
              detail:
                type: string
                description: A granular description on the specific error related to a body property, query parameter, path parameters, and/or header.
                maxLength: 4096
              pointer:
                type: string
                description: A JSON Pointer to a specific request body property that is the source of error.
                maxLength: 1024
              parameter:
                type: string
                description: The name of the query or path parameter that is the source of error.
                maxLength: 1024
              header:
                type: string
                description: The name of the header that is the source of error.
                maxLength: 1024
              code:
                type: string
                description: A string containing additional provider specific codes to identify the error context.
                maxLength: 50
            required:
              - detail
      required:
        - detail
