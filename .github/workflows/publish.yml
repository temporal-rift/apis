name: Publish API contracts to GitHub Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: list
        run: |
          # Every top-level directory with its own pom.xml is a bounded-context module.
          MODULES=$(find . -mindepth 2 -maxdepth 2 -name pom.xml -exec dirname {} \; | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"
          echo "Discovered modules: $MODULES"

  publish:
    needs: discover-modules
    if: needs.discover-modules.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@ba34de01b7f4ba2ab8e2860df8993a29f4477056 # v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 4.0.0-rc-7
          settings-githubServer: false
          settings-servers: |
            [
              {
                "id": "github",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-publish-${{ matrix.module }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-publish-${{ matrix.module }}-

      - name: Check if module version already published
        id: version_check
        env:
          MODULE: ${{ matrix.module }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ matrix.module }}
        run: |
          echo "--- Resolving $MODULE groupId + artifactId + version ---"
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -DforceStdout -q -N)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -DforceStdout -q -N)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -DforceStdout -q -N)
          echo "Resolved: $GROUP_ID:$ARTIFACT_ID:$VERSION"

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::$MODULE has a SNAPSHOT version ($VERSION) — releases are pinned by consumers, so SNAPSHOTs are never published."
            exit 1
          fi

          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')
          REGISTRY_URL="https://maven.pkg.github.com/temporal-rift/apis/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.pom"
          echo "--- Checking GitHub Packages ---"
          echo "URL: $REGISTRY_URL"

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -L -u "x-access-token:${GITHUB_TOKEN}" --retry 3 --retry-delay 5 --retry-connrefused "$REGISTRY_URL")
          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "Version $VERSION already exists in GitHub Packages — skipping publish"
            echo "VERSION_CHANGED=false" >> "$GITHUB_ENV"
          elif [ "$RESPONSE" = "404" ]; then
            echo "Version $VERSION not found in GitHub Packages — will publish"
            echo "VERSION_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Unexpected HTTP status $RESPONSE checking GitHub Packages for $MODULE — aborting rather than risking a false publish."
            exit 1
          fi

      - name: Publish module to GitHub Packages
        if: env.VERSION_CHANGED == 'true' && github.ref == 'refs/heads/main'
        env:
          MODULE: ${{ matrix.module }}
        run: mvn --batch-mode -pl "$MODULE" deploy -Pgithub

      - name: Create and push tag
        if: github.ref == 'refs/heads/main'
        env:
          MODULE: ${{ matrix.module }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG="$MODULE/v${VERSION}"
          if git ls-remote --exit-code --tags "https://github.com/temporal-rift/apis.git" "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi
          git tag "$TAG"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/temporal-rift/apis.git" "$TAG"
