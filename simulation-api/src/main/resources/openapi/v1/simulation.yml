openapi: 3.0.3
info:
  title: Temporal Rift Simulation Workbench API
  version: 4.1.0
  description: >-
    Creates immutable experiment manifests and provides durable run control, evidence inspection,
    statistical reporting, paired comparisons, perspective-safe replay, guided setup discovery
    (lane bundles and experiment templates), balance criteria and run evaluation, variant rules
    expressed as a baseline document plus validated parameter overrides (parameter spaces and
    variant-rules previews), and durable configuration search campaigns that generate candidates,
    screen them, and confirm a short list on fresh seeds, for the separate simulation workbench.
    The workbench orchestrates real game services; it never replaces their authoritative gameplay
    rules.

servers:
  - url: /

security:
  - bearerAuth: [ ]

tags:
  - name: Experiments
  - name: Runs
  - name: Reports
  - name: Comparisons
  - name: Cases
  - name: Policies
  - name: ParameterSpaces
  - name: VariantRules
  - name: Criteria
  - name: Evaluations
  - name: Campaigns

paths:
  /api/v1/experiments:
    get:
      tags: [ Experiments ]
      operationId: listExperiments
      summary: List frozen experiments, newest first
      description: Requires `simulation:read`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of experiment summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperimentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
    post:
      tags: [ Experiments ]
      operationId: createExperiment
      summary: Freeze a new immutable experiment manifest
      description: >-
        Requires `simulation:write`. The resolved rules and content bytes represented by the
        manifest are retained by the product. A later rules or content change requires a new
        experiment; this operation never rewrites an existing manifest.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentManifest'
      responses:
        '201':
          description: Experiment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '400': { $ref: '#/components/responses/InvalidExperiment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /api/v1/experiment-previews:
    post:
      tags: [ Experiments ]
      operationId: previewExperiment
      summary: Preview the exact case matrix of a manifest without freezing it
      description: >-
        Requires `simulation:write`. Stateless: nothing is stored, and no experiment, idempotency
        record or run results. The manifest is validated exactly as `createExperiment` validates it,
        and the digest, case keys and order equal those of the experiment frozen from the same
        manifest and of any run started from it. Cases are paged; `breakdown` and `caseCount` cover
        the whole matrix.
      x-required-scopes: [ simulation:write ]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - $ref: '#/components/parameters/Offset'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentManifest'
      responses:
        '200':
          description: The matrix the manifest would freeze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperimentPreview' }
        '400': { $ref: '#/components/responses/InvalidExperiment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/experiments/{experimentId}:
    get:
      tags: [ Experiments ]
      operationId: getExperiment
      summary: Get a frozen experiment
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
      responses:
        '200':
          description: The experiment exactly as frozen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Experiment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/experiments/{experimentId}/runs:
    post:
      tags: [ Runs ]
      operationId: startRun
      summary: Start a run from a frozen experiment
      description: >-
        Requires `simulation:write`. Inputs are already frozen in the experiment, so the request
        body is deliberately empty. Repeating the same idempotency key returns the original run.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '202':
          description: Run accepted for execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400': { $ref: '#/components/responses/InvalidExperiment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict, immutable experiment, or manifest mismatch
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/runs:
    get:
      tags: [ Runs ]
      operationId: listRuns
      summary: List runs, newest first
      description: Requires `simulation:read`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - name: experimentId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RunState' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/runs/{runId}:
    get:
      tags: [ Runs ]
      operationId: getRun
      summary: Get durable run progress
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status and counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/cancel:
    post:
      tags: [ Runs ]
      operationId: cancelRun
      summary: Stop scheduling new cases for a run
      description: >-
        Requires `simulation:write`. Cancellation retains all completed evidence. A first accepted
        cancellation returns 202; repeating cancellation after a terminal state returns 200 with
        that same terminal run representation.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The run was already terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /api/v1/runs/{runId}/resume:
    post:
      tags: [ Runs ]
      operationId: resumeRun
      summary: Resume an interrupted run
      description: >-
        Requires `simulation:write`. Resume is legal only from INTERRUPTED. Retained successful
        cases remain one logical sample and are not scheduled again.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Resumption accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or invalid run state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/runs/{runId}/report:
    get:
      tags: [ Reports ]
      operationId: getRunReport
      summary: Get the stratified statistical report for a run
      description: >-
        Requires `simulation:read`. For every variant, policy and player count the report holds a
        pooled cohort, one cohort per seat, one per faction set, and one per faction set and seat.
        Only succeeded cases are games: pending, running, failed and cancelled cases appear in case
        counts and never in a game metric's denominator, and the report stays explicitly incomplete while
        any requested case has not succeeded. `Accept: text/csv` returns the same report as RFC 4180
        CSV with a header row and one row per cohort metric.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Report with completeness, cohort populations and attributed metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
            text/csv:
              schema:
                type: string
                description: >-
                  RFC 4180 CSV. A header row, then one row per cohort metric in report order, with the
                  columns formatVersion, runId, manifestDigest, analysisVersion, analysisSeed, complete,
                  variantLabel, policyId, policyVersion, playerCount, factionSet (factions joined by `|`),
                  seatIndex, eligibleGames, independentBlocks, requested, pending, running, succeeded,
                  failed, cancelled, metric, statistic, faction, cardType, cardGrade, specialAction,
                  paradoxType, endReason, quantile, failureCode, unit, value, numerator, denominator,
                  status, intervalLower, intervalUpper, unknownCount. `failureCode` is empty for a metric
                  not split by failure code, including the all-codes `failure_share` metric, and holds the
                  `AttemptFailureCode` of a per-code `failure_share` metric. An empty field is a null value.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/comparisons:
    get:
      tags: [ Comparisons ]
      operationId: listComparisons
      summary: List comparisons, newest first
      description: Requires `simulation:read`. `runId` matches a comparison's baseline or candidate run.
      x-required-scopes: [ simulation:read ]
      parameters:
        - name: runId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of comparisons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
    post:
      tags: [ Comparisons ]
      operationId: createComparison
      summary: Create a paired comparison between two run variants
      description: >-
        Requires `simulation:write`. Each side names a run and one of its variants; both sides may
        name the same run. The two frozen manifests must be equal in services, contracts, policies
        with their parameters, seeds, player counts, faction sets, seat rotation mode, timing mode,
        and maximum rejected candidates per window; they may differ in the compared variants' rules
        and content and in execution-only bounds. A baseline and a candidate case pair when they
        share seed, player count, policy, and seat-to-faction assignment; a seed is one block, and
        only blocks whose every pair succeeded on both sides enter the paired estimates.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComparisonRequest' }
      responses:
        '201':
          description: Comparison created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
        '400': { $ref: '#/components/responses/InvalidComparison' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/IncomparableRuns' }

  /api/v1/comparisons/{comparisonId}:
    get:
      tags: [ Comparisons ]
      operationId: getComparison
      summary: Get a paired comparison
      description: >-
        Requires `simulation:read`. The comparison is recomputed from current case results under the
        analysis version and seed pinned at creation, and stays explicitly incomplete while any pair
        has a side that has not succeeded. `Accept: text/csv` returns one row per cohort metric
        difference.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/ComparisonId'
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comparison' }
            text/csv:
              schema:
                type: string
                description: >-
                  RFC 4180 CSV. A header row, then one row per cohort metric difference, with the columns
                  formatVersion, comparisonId, baselineRunId, baselineVariantLabel, candidateRunId,
                  candidateVariantLabel, analysisVersion, analysisSeed, complete, policyId, policyVersion,
                  playerCount, factionSet (factions joined by `|`), seatIndex, matchedBlocks,
                  excludedBlocks, metric, statistic, faction, cardType, cardGrade, specialAction,
                  paradoxType, endReason, quantile, unit, baselineValue, candidateValue, difference,
                  status, intervalLower, intervalUpper. An empty field is a null value.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/cases:
    get:
      tags: [ Cases ]
      operationId: listCases
      summary: List the cases of a run in matrix order
      description: Requires `simulation:read`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CaseState' }
        - name: variantLabel
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of case summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/cases/{caseId}:
    get:
      tags: [ Cases ]
      operationId: getCase
      summary: Get one logical case and its attempts
      description: >-
        Requires `simulation:read`. Reproduction attempts are separate from research attempts and
        never add another statistical sample to the case.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: Case and retained attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/cases/{caseId}/replay:
    get:
      tags: [ Cases ]
      operationId: getCaseReplay
      summary: Read an ordered perspective-safe case replay
      description: >-
        Requires `simulation:read`; OBSERVER perspective additionally requires `simulation:observe`.
        PLAYER requires seatIndex and includes only facts entitled to that seat at each step. OBSERVER
        evidence is never supplied to executable policies.
      x-required-scopes: [ simulation:read ]
      x-observer-required-scope: simulation:observe
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CaseId'
        - name: perspective
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ReplayPerspective' }
        - name: seatIndex
          in: query
          required: false
          description: Required for PLAYER and prohibited for OBSERVER.
          schema:
            type: integer
            minimum: 0
        - name: afterStep
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Replay page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Replay' }
        '400': { $ref: '#/components/responses/InvalidReplayPerspective' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/cases/{caseId}/reproductions:
    post:
      tags: [ Cases ]
      operationId: reproduceCase
      summary: Request an exact reproduction of a saved case
      description: >-
        Requires `simulation:write`. The reproduction uses the pinned manifest and transcript in a
        clean lane, reports the first semantic divergence when necessary, and does not create a new
        research sample.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Reproduction accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reproduction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or manifest mismatch
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/policies:
    get:
      tags: [ Policies ]
      operationId: listPolicies
      summary: List the bot policy bundles a manifest may reference
      description: >-
        Requires `simulation:read`. A manifest policy built from an entry's `id`, `version` and
        `artifactDigest` passes policy verification.
      x-required-scopes: [ simulation:read ]
      responses:
        '200':
          description: Every referenceable policy bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/lane-bundles:
    get:
      tags: [ Experiments ]
      operationId: listLaneBundles
      summary: List distinct lane-served rules and content bundles
      description: >-
        Requires `simulation:read`. Returns every distinct bundle some configured lane serves,
        so a client can let the designer select a variant's rules and content instead of typing
        digests. A bundle is one pair of effective rules digest and effective content digest,
        together with the service provenance and contract versions of the lanes that serve it.
        Items are ordered ascending `effectiveRulesDigest`, then ascending
        `effectiveContentDigest`. With no configured lane the response is `200` with `items`
        empty and `total` 0. Never returns a lane identifier, URL, credential or bot identity.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of lane bundles in digest order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LaneBundlePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/experiment-templates:
    get:
      tags: [ Experiments ]
      operationId: listExperimentTemplates
      summary: List named experiment starting points
      description: >-
        Requires `simulation:read`. Returns named starting points, each with complete defaults
        for every manifest field that does not identify a bundle, so a client can pre-fill a
        draft that it then assembles with the chosen bundles and the designer's edits into an
        `ExperimentManifest` for `createExperiment` or `previewExperiment`. Items are ordered
        ascending `templateId`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of experiment templates in template order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExperimentTemplatePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/balance-criteria:
    get:
      tags: [ Criteria ]
      operationId: listBalanceCriteria
      summary: List every served balance criterion version, ordered by version
      description: >-
        Requires `simulation:read`. Returns every criterion version the workbench serves,
        ordered ascending `version`. Criteria are read-only resources served from the
        workbench's configuration; a new version is added by configuration, never through
        the API.
      x-required-scopes: [ simulation:read ]
      responses:
        '200':
          description: Every served criterion version in version order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceCriterionCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/balance-criteria/{criterionVersion}:
    get:
      tags: [ Criteria ]
      operationId: getBalanceCriterion
      summary: Get one balance criterion version
      description: >-
        Requires `simulation:read`. Returns one criterion version. An unknown version
        returns `404 RESOURCE_NOT_FOUND`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/CriterionVersion'
      responses:
        '200':
          description: The requested criterion version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceCriterion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/runs/{runId}/evaluation:
    get:
      tags: [ Evaluations ]
      operationId: getRunEvaluation
      summary: Get the derived evaluation of a run variant against a criterion
      description: >-
        Requires `simulation:read`. The evaluation is computed from the run's cases on every
        read, with the analysis seed; the same run, variant, criterion version and mode always
        return byte-identical documents, and nothing is persisted. Every criterion line is
        expanded into one evaluated line per cohort and dimension value it covers. The faction
        ratio and the sum of several `failure_share` codes are each recomputed in every
        bootstrap resample; their interval is the interval of the derived value, never a
        combination of separate intervals. `SCREENING` mode never returns `CONFIRMED`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: variantLabel
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: criterionVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [ SCREENING, CONFIRMATION ], default: SCREENING }
      responses:
        '200':
          description: Derived evaluation with validity, verdict, score and evaluated lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunEvaluation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/parameter-spaces:
    get:
      tags: [ ParameterSpaces ]
      operationId: listParameterSpaces
      summary: List every parameter space version the workbench serves
      description: >-
        Requires `simulation:read`. Returns every parameter space version the workbench serves, ordered
        ascending by `version`.
      x-required-scopes: [ simulation:read ]
      responses:
        '200':
          description: Every served parameter space version in version order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterSpaceCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/parameter-spaces/{version}:
    get:
      tags: [ ParameterSpaces ]
      operationId: getParameterSpace
      summary: Get one served parameter space version
      description: Requires `simulation:read`. An unknown version is not found.
      x-required-scopes: [ simulation:read ]
      parameters:
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The requested parameter space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParameterSpace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/variant-rules-previews:
    post:
      tags: [ VariantRules ]
      operationId: previewVariantRules
      summary: Apply and validate a variant's overrides without persisting anything
      description: >-
        Requires `simulation:read`. Stateless: nothing is stored. Applies and validates the overrides
        against the named parameter space, drops overrides equal to the baseline value, and returns the
        effective rules, their digest and the normalised overrides that `createExperiment` would freeze.
      x-required-scopes: [ simulation:read ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantRulesPreviewRequest'
      responses:
        '200':
          description: The effective rules the variant would freeze
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantRulesPreview' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }

  /api/v1/experiments/{experimentId}/variants/{label}/rules:
    get:
      tags: [ VariantRules ]
      operationId: getVariantRules
      summary: Read the frozen effective rules of one experiment variant
      description: Requires `simulation:read`. An unknown experiment or variant label is not found.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/ExperimentId'
        - name: label
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: The variant's frozen effective rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/campaigns:
    get:
      tags: [ Campaigns ]
      operationId: listCampaigns
      summary: List configuration search campaigns, newest first
      description: Requires `simulation:read`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of campaigns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
    post:
      tags: [ Campaigns ]
      operationId: createCampaign
      summary: Create and queue a configuration search campaign
      description: >-
        Requires `simulation:write`. Validates the definition against the served parameter space,
        criterion and baseline artifacts, and freezes it with separate search and confirmation
        master seeds. `budgetSeconds` defaults to 14400 (four active hours) and `parallelism` to 4.
        The campaign is created in `QUEUED` and starts without further client action. A definition
        whose master seeds are equal is refused. Repeating the same idempotency key and body
        returns the original campaign.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignDefinition'
      responses:
        '201':
          description: Campaign created and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400': { $ref: '#/components/responses/InvalidCampaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /api/v1/campaigns/{campaignId}:
    get:
      tags: [ Campaigns ]
      operationId: getCampaign
      summary: Get one configuration search campaign
      description: Requires `simulation:read`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: The requested campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
              examples:
                paused:
                  summary: A search paused by the designer
                  value:
                    campaignId: 3c1c4a7e-8b2d-4f46-9a71-5d0e2b6c8f91
                    name: threshold-halving-01
                    baseline:
                      rulesArtifact:
                        digest: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                      contentArtifact:
                        digest: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752
                    parameterSpaceVersion: 1
                    criterionVersion: 1
                    policies:
                      - id: faction-greedy
                        version: 1.0.0
                        artifactDigest: 5a1c1e2d3f405162738495a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f80
                        parameters: {}
                        seatAssignment:
                          - { seatIndex: 0, policyId: faction-greedy, policyVersion: 1.0.0 }
                          - { seatIndex: 1, policyId: faction-greedy, policyVersion: 1.0.0 }
                          - { seatIndex: 2, policyId: faction-greedy, policyVersion: 1.0.0 }
                          - { seatIndex: 3, policyId: faction-greedy, policyVersion: 1.0.0 }
                    playerCounts: [ 4 ]
                    budgetSeconds: 14400
                    parallelism: 2
                    searchMasterSeed: '42'
                    confirmationMasterSeed: '43'
                    algorithm:
                      version: SUCCESSIVE_HALVING_V1
                      initialCandidates: 8
                      screeningSeeds: 2
                      eta: 2
                      shortListSize: 2
                    state: PAUSED
                    spentSeconds: 900
                    round: 2
                    shortList: []
                    confirmation: null
                    failure: null
                    createdAt: '2026-10-17T10:00:00Z'
                    startedAt: '2026-10-17T10:00:01Z'
                    finishedAt: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/campaigns/{campaignId}/pause:
    post:
      tags: [ Campaigns ]
      operationId: pauseCampaign
      summary: Pause a queued or running campaign
      description: >-
        Requires `simulation:write`. A pause is accepted from `QUEUED` and `RUNNING`, moves the
        campaign to `PAUSED`, and returns it. A pause of an already `PAUSED` campaign returns that
        campaign unchanged. Every other state returns `409 INVALID_CAMPAIGN_STATE`. Games in flight
        finish or are discarded and are never counted twice.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The paused campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or invalid campaign state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/campaigns/{campaignId}/resume:
    post:
      tags: [ Campaigns ]
      operationId: resumeCampaign
      summary: Resume a paused campaign
      description: >-
        Requires `simulation:write`. A resume is accepted from `PAUSED` and moves the campaign to
        `RUNNING`. A resume of an already `RUNNING` campaign returns that campaign unchanged. Every
        other state returns `409 INVALID_CAMPAIGN_STATE`.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The resumed campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or invalid campaign state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/campaigns/{campaignId}/cancel:
    post:
      tags: [ Campaigns ]
      operationId: cancelCampaign
      summary: Cancel a campaign
      description: >-
        Requires `simulation:write`. A cancel is accepted from every state except `COMPLETED` and
        `FAILED`, and moves the campaign to `CANCELLED`. A cancel of an already `CANCELLED`
        campaign returns that campaign unchanged. `COMPLETED` and `FAILED` return
        `409 INVALID_CAMPAIGN_STATE`.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The cancelled campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or invalid campaign state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/campaigns/{campaignId}/parallelism:
    put:
      tags: [ Campaigns ]
      operationId: setCampaignParallelism
      summary: Change a campaign's parallelism
      description: >-
        Requires `simulation:write`. Allowed from every state except `COMPLETED`, `CANCELLED` and
        `FAILED`. The new value takes effect for the next game started; games already in flight are
        unaffected.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignParallelismUpdate'
      responses:
        '200':
          description: The campaign with its new parallelism
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '400': { $ref: '#/components/responses/InvalidCampaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency conflict or invalid campaign state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/campaigns/{campaignId}/log:
    get:
      tags: [ Campaigns ]
      operationId: getCampaignLog
      summary: Read a campaign's decisions in decision order
      description: Requires `simulation:read`. Entries are ordered by `sequence`.
      x-required-scopes: [ simulation:read ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of campaign log entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignLogPage' }
              examples:
                gate-failure:
                  summary: One candidate discarded by a failed criterion gate
                  value:
                    items:
                      - sequence: 1
                        round: 1
                        candidateId: c-0003
                        overrides:
                          game.rules.win-score-threshold: 18
                        effectiveRulesDigest: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                        seeds: [ '42', '43' ]
                        gamesSpent: 2
                        evaluation:
                          verdict: REJECTED
                          score: null
                        decision: DISCARDED
                        reason: GATE_FAILS
                        evidence:
                          lineIds: [ 'G-01' ]
                    total: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/campaigns/{campaignId}/confirmation:
    post:
      tags: [ Campaigns ]
      operationId: startConfirmation
      summary: Confirm a campaign's short list on fresh seeds
      description: >-
        Requires `simulation:write`. Allowed only from `SEARCH_COMPLETED`; moves the campaign to
        `CONFIRMING` and starts one confirmation run per short-listed candidate and one for the
        baseline. Confirmation seeds derive from `confirmationMasterSeed` only; if any of them
        already appears in the campaign log's `seeds`, nothing starts.
      x-required-scopes: [ simulation:write ]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Confirmation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/InsufficientScope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Idempotency conflict, invalid campaign state, or overlapping confirmation seeds
            (code IDEMPOTENCY_CONFLICT, INVALID_CAMPAIGN_STATE, or SEED_OVERLAP)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        UUID identifying one mutation request. Repeating a key with the same request representation
        returns the original resource; reusing it with a changed representation returns
        IDEMPOTENCY_CONFLICT.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CriterionVersion:
      name: criterionVersion
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InsufficientScope:
      description: The bearer token lacks a required simulation scope
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: The requested resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidExperiment:
      description: >-
        The manifest is invalid (code INVALID_EXPERIMENT). A refused variant's overrides also carry a
        `reason` and name the offending value in `field`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidComparison:
      description: >-
        The comparison request is invalid, names a variant absent from its run's manifest, or names
        the same run and variant on both sides (code INVALID_COMPARISON)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidReplayPerspective:
      description: The replay query is invalid (code INVALID_REPLAY_PERSPECTIVE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IdempotencyConflict:
      description: The idempotency key was reused with a different request (code IDEMPOTENCY_CONFLICT)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    IncomparableRuns:
      description: >-
        The two sides' manifests differ in a gameplay-affecting definition; the detail names every
        differing definition (code INCOMPARABLE_RUNS)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidRequest:
      description: >-
        The request is invalid, such as paging outside 1 to 500, a missing or invalid evaluation query
        parameter, or a refused variant-rules preview (code INVALID_REQUEST). A refused variant's
        overrides carry a `reason` and name the offending value in `field`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidCampaign:
      description: >-
        The campaign definition or parallelism update is invalid (code INVALID_CAMPAIGN). `field`
        names the offending value and `reason` names why it was refused.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    Sha256Digest:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Lowercase SHA-256 hexadecimal digest.
    DecimalUint64:
      type: string
      pattern: '^(0|[1-9][0-9]{0,19})$'
      description: Decimal unsigned 64-bit integer. Implementations reject values above 18446744073709551615.
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [ digest ]
      description: >-
        A portable content-addressed artifact reference. It contains neither credentials nor a
        machine-local path; the resolved content is retained by the product.
      properties:
        digest: { $ref: '#/components/schemas/Sha256Digest' }
        mediaType:
          type: string
          minLength: 1
          nullable: true
        name:
          type: string
          minLength: 1
          nullable: true

    Variant:
      type: object
      additionalProperties: false
      required: [ label, rulesArtifact, contentArtifact, effectiveRulesDigest, effectiveContentDigest ]
      description: >-
        A baseline rules document plus optional parameter overrides. `rulesArtifact` names the baseline;
        `effectiveRulesDigest` is the effective rules digest of that baseline with the overrides and their
        derived values applied. An empty `overrides` means the baseline itself.
      properties:
        label:
          type: string
          minLength: 1
        rulesArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        contentArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        effectiveRulesDigest: { $ref: '#/components/schemas/Sha256Digest' }
        effectiveContentDigest: { $ref: '#/components/schemas/Sha256Digest' }
        parameterSpaceVersion:
          type: integer
          minimum: 1
          description: >-
            The parameter space the overrides are validated against. Required when `overrides` is
            non-empty, and absent or ignored when it is empty.
        overrides:
          type: object
          additionalProperties: { type: number }
          default: {}
          description: >-
            Values replacing the baseline's, keyed by parameter key. An override equal to the baseline
            value is dropped when the manifest is frozen.
      not:
        required: [ overrides ]
        properties:
          overrides:
            type: object
            minProperties: 1
        not:
          required: [ parameterSpaceVersion ]

    ServiceProvenance:
      type: object
      additionalProperties: false
      required: [ imageDigest, sourceRevision ]
      properties:
        imageDigest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        sourceRevision:
          type: string
          pattern: '^[a-f0-9]{7,64}$'
    ServiceProvenanceMap:
      type: object
      additionalProperties: false
      required: [ gameService, timelineService, readService ]
      properties:
        gameService: { $ref: '#/components/schemas/ServiceProvenance' }
        timelineService: { $ref: '#/components/schemas/ServiceProvenance' }
        readService: { $ref: '#/components/schemas/ServiceProvenance' }
    ContractVersions:
      type: object
      minProperties: 1
      additionalProperties:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
      description: Exact published participant and event module versions keyed by artifact name.

    SeatPolicyAssignment:
      type: object
      additionalProperties: false
      required: [ seatIndex, policyId, policyVersion ]
      properties:
        seatIndex:
          type: integer
          minimum: 0
        policyId:
          type: string
          minLength: 1
        policyVersion:
          type: string
          minLength: 1
    Policy:
      type: object
      additionalProperties: false
      required: [ id, version, artifactDigest, parameters, seatAssignment ]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        artifactDigest: { $ref: '#/components/schemas/Sha256Digest' }
        parameters:
          type: object
          additionalProperties: true
        seatAssignment:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/SeatPolicyAssignment' }
    FactionSet:
      type: array
      minItems: 3
      maxItems: 5
      uniqueItems: true
      items: { $ref: '#/components/schemas/Faction' }

    ExperimentManifest:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - name
        - variants
        - services
        - contracts
        - policies
        - seeds
        - playerCounts
        - factionSets
        - seatRotationMode
        - timingMode
        - concurrency
        - caseWallTimeoutSeconds
        - maxRejectedCandidatesPerWindow
      properties:
        schemaVersion:
          type: integer
          enum: [ 1 ]
        name:
          type: string
          minLength: 1
          maxLength: 120
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Variant' }
          description: Variant labels are unique.
        services: { $ref: '#/components/schemas/ServiceProvenanceMap' }
        contracts: { $ref: '#/components/schemas/ContractVersions' }
        policies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Policy' }
        seeds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DecimalUint64' }
        playerCounts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [ 3, 4, 5 ]
        factionSets:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/FactionSet' }
          description: Every set's size must match a selected player count.
        seatRotationMode:
          type: string
          enum: [ CYCLIC ]
        timingMode:
          type: string
          enum: [ LOGICAL ]
        concurrency:
          type: integer
          minimum: 1
        caseWallTimeoutSeconds:
          type: integer
          minimum: 1
        maxRejectedCandidatesPerWindow:
          type: integer
          minimum: 1

    Experiment:
      type: object
      additionalProperties: false
      required: [ experimentId, manifest, manifestDigest, createdAt ]
      properties:
        experimentId: { type: string, format: uuid }
        manifest: { $ref: '#/components/schemas/ExperimentManifest' }
        manifestDigest: { $ref: '#/components/schemas/Sha256Digest' }
        createdAt: { type: string, format: date-time }
    StartRunRequest:
      type: object
      additionalProperties: false
      description: "Empty by design: the experiment's manifest already freezes every execution input."

    RunState:
      type: string
      enum: [ QUEUED, RUNNING, INTERRUPTED, CANCELLING, CANCELLED, COMPLETED, FAILED ]
    CaseCounts:
      type: object
      additionalProperties: false
      required: [ requested, pending, running, succeeded, failed, cancelled ]
      properties:
        requested: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    Failure:
      type: object
      additionalProperties: false
      required: [ code, message ]
      properties:
        code:
          type: string
          minLength: 1
          description: Recorded attempt-failure code such as CONTRACT_MISMATCH or CONFIGURATION_DRIFT.
        message: { type: string, minLength: 1 }
    Run:
      type: object
      additionalProperties: false
      required: [ runId, experimentId, state, counts, createdAt, startedAt, finishedAt, failure ]
      properties:
        runId: { type: string, format: uuid }
        experimentId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/RunState' }
        counts: { $ref: '#/components/schemas/CaseCounts' }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        failure:
          allOf: [ { $ref: '#/components/schemas/Failure' } ]
          nullable: true

    CaseState:
      type: string
      enum: [ PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED ]
    AttemptState:
      type: string
      enum: [ RUNNING, SUCCEEDED, FAILED, CANCELLED, INTERRUPTED ]
    SeatAssignment:
      type: object
      additionalProperties: false
      required: [ seatIndex, faction, policyId, policyVersion ]
      properties:
        seatIndex: { type: integer, minimum: 0 }
        faction: { $ref: '#/components/schemas/Faction' }
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
    CaseResult:
      type: object
      additionalProperties: false
      required: [ endReason, winners, finalScores, eras, rounds, decisions, semanticDigest ]
      properties:
        endReason:
          $ref: '#/components/schemas/TerminalEndReason'
        winners:
          type: array
          items: { $ref: '#/components/schemas/Winner' }
        finalScores:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/FinalScore' }
        eras: { type: integer, minimum: 0 }
        rounds: { type: integer, minimum: 0 }
        decisions: { type: integer, minimum: 0 }
        semanticDigest: { $ref: '#/components/schemas/Sha256Digest' }
    Attempt:
      type: object
      additionalProperties: false
      required: [ attemptId, ordinal, state, gameId, checkpointArtifact, failure ]
      properties:
        attemptId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/AttemptState' }
        gameId: { type: string, format: uuid, nullable: true }
        checkpointArtifact:
          allOf: [ { $ref: '#/components/schemas/ArtifactReference' } ]
          nullable: true
        failure:
          allOf: [ { $ref: '#/components/schemas/Failure' } ]
          nullable: true
    Case:
      type: object
      additionalProperties: false
      required: [ caseId, caseKey, runId, variantLabel, seed, playerCount, assignments, state, attempts, result ]
      properties:
        caseId: { type: string, format: uuid }
        caseKey: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        variantLabel: { type: string, minLength: 1 }
        seed: { $ref: '#/components/schemas/DecimalUint64' }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        assignments:
          type: array
          minItems: 3
          maxItems: 5
          items: { $ref: '#/components/schemas/SeatAssignment' }
        state: { $ref: '#/components/schemas/CaseState' }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/Attempt' }
        result:
          allOf: [ { $ref: '#/components/schemas/CaseResult' } ]
          nullable: true

    ReproductionState:
      type: string
      enum: [ QUEUED, RUNNING, MATCH, DIVERGED, FAILED ]
    Divergence:
      type: object
      additionalProperties: false
      required: [ step, kind, expected, actual ]
      properties:
        step: { type: integer, minimum: 0 }
        kind: { type: string, minLength: 1 }
        expected: { type: object, additionalProperties: true }
        actual: { type: object, additionalProperties: true }
    Reproduction:
      type: object
      additionalProperties: false
      required: [ reproductionId, attemptId, state, firstDivergence ]
      properties:
        reproductionId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ReproductionState' }
        firstDivergence:
          allOf: [ { $ref: '#/components/schemas/Divergence' } ]
          nullable: true

    ReportCaseCounts:
      type: object
      additionalProperties: false
      required: [ requested, pending, running, succeeded, failed, cancelled ]
      properties:
        requested: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
    MetricStatus:
      type: string
      enum: [ AVAILABLE, NO_DATA, INSUFFICIENT_SAMPLE ]
      description: >-
        NO_DATA when the denominator is 0 (value and interval null); INSUFFICIENT_SAMPLE when fewer
        than two independent blocks support the value (value present, interval null).
    MetricStatistic:
      type: string
      enum: [ RATE, MEAN, QUANTILE ]
      description: >-
        RATE is numerator over denominator; MEAN is a sum over its sample size; QUANTILE is the
        smallest observed value whose cumulative share reaches the quantile, with a null numerator
        and the sample size as denominator.
    MetricDimensions:
      type: object
      additionalProperties: false
      description: >-
        What the metric is restricted to. An absent property means the metric is not split by it.
      properties:
        faction: { $ref: '#/components/schemas/Faction' }
        cardType: { $ref: '#/components/schemas/CardType' }
        cardGrade: { $ref: '#/components/schemas/CardGrade' }
        specialAction: { $ref: '#/components/schemas/SpecialAction' }
        paradoxType: { $ref: '#/components/schemas/ParadoxType' }
        endReason: { $ref: '#/components/schemas/TerminalEndReason' }
        quantile:
          type: number
          minimum: 0
          maximum: 1
          exclusiveMinimum: true
          exclusiveMaximum: true
        failureCode: { $ref: '#/components/schemas/AttemptFailureCode' }
    ConfidenceInterval:
      type: object
      additionalProperties: false
      required: [ level, lower, upper, method ]
      description: >-
        Percentile interval over resamples of independent blocks. A seed is the independent block:
        cases that share it share their gameplay randomness across faction sets, seat rotations and
        variants.
      properties:
        level: { type: number, enum: [ 0.95 ] }
        lower: { type: number }
        upper: { type: number }
        method: { type: string, enum: [ BLOCK_BOOTSTRAP ] }
    Metric:
      type: object
      additionalProperties: false
      required: [ name, statistic, dimensions, value, numerator, denominator, unit, status, interval, unknownCount ]
      properties:
        name:
          type: string
          minLength: 1
          description: >-
            Metric of the report's analysis version, such as faction_win_rate,
            faction_shared_win_rate, score, ending_cause_rate, eras, cards_played,
            card_playable_rate, special_accepts, paradox_findings, or distinct_cascaded_events.
            Reports of analysis version `2` additionally carry `failure_share` (statistic
            `RATE`, unit `cases`) in every cohort that pools seats.
        statistic: { $ref: '#/components/schemas/MetricStatistic' }
        dimensions: { $ref: '#/components/schemas/MetricDimensions' }
        value: { type: number, nullable: true }
        numerator: { type: number, nullable: true }
        denominator: { type: integer, minimum: 0 }
        unit: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/MetricStatus' }
        interval:
          allOf: [ { $ref: '#/components/schemas/ConfidenceInterval' } ]
          nullable: true
        unknownCount:
          type: integer
          minimum: 0
          description: >-
            Named count of opportunities whose playability is unknown; they are excluded from the
            denominator.
    Cohort:
      type: object
      additionalProperties: false
      required:
        - variantLabel
        - policyId
        - policyVersion
        - playerCount
        - factionSet
        - seatIndex
        - caseCounts
        - eligibleGames
        - independentBlocks
        - metrics
      properties:
        variantLabel: { type: string, minLength: 1 }
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        factionSet:
          allOf: [ { $ref: '#/components/schemas/FactionSet' } ]
          nullable: true
          description: Null when the cohort pools every faction set of its player count.
        seatIndex:
          type: integer
          minimum: 0
          nullable: true
          description: Null when the cohort pools every seat.
        caseCounts: { $ref: '#/components/schemas/ReportCaseCounts' }
        eligibleGames:
          type: integer
          minimum: 0
          description: Succeeded cases of the cohort, each counted once.
        independentBlocks:
          type: integer
          minimum: 0
          description: Distinct seeds among the cohort's eligible games.
        metrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
    Report:
      type: object
      additionalProperties: false
      required: [ formatVersion, runId, manifestDigest, analysisVersion, analysisSeed, complete, caseCounts, cohorts ]
      properties:
        formatVersion:
          type: integer
          enum: [ 2 ]
          description: Version of the report's JSON and CSV layout; the first CSV column.
        runId: { type: string, format: uuid }
        manifestDigest: { $ref: '#/components/schemas/Sha256Digest' }
        analysisVersion: { type: string, minLength: 1 }
        analysisSeed: { $ref: '#/components/schemas/DecimalUint64' }
        complete:
          type: boolean
          description: False whenever requested cases remain pending, running, failed, or cancelled.
        caseCounts: { $ref: '#/components/schemas/ReportCaseCounts' }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/Cohort' }

    ComparisonSide:
      type: object
      additionalProperties: false
      required: [ runId, variantLabel ]
      properties:
        runId: { type: string, format: uuid }
        variantLabel: { type: string, minLength: 1 }
    ComparisonRequest:
      type: object
      additionalProperties: false
      required: [ baseline, candidate ]
      properties:
        baseline: { $ref: '#/components/schemas/ComparisonSide' }
        candidate: { $ref: '#/components/schemas/ComparisonSide' }
    DeclaredDifference:
      type: object
      additionalProperties: false
      required: [ field, baselineDigest, candidateDigest ]
      properties:
        field: { type: string, enum: [ RULES, CONTENT ] }
        baselineDigest: { $ref: '#/components/schemas/Sha256Digest' }
        candidateDigest: { $ref: '#/components/schemas/Sha256Digest' }
    PairSeat:
      type: object
      additionalProperties: false
      required: [ seatIndex, faction ]
      properties:
        seatIndex: { type: integer, minimum: 0 }
        faction: { $ref: '#/components/schemas/Faction' }
    ExcludedPair:
      type: object
      additionalProperties: false
      required:
        - seed
        - playerCount
        - policyId
        - policyVersion
        - seats
        - baselineCaseId
        - candidateCaseId
        - baselineState
        - candidateState
        - reason
      properties:
        seed: { $ref: '#/components/schemas/DecimalUint64' }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        seats:
          type: array
          minItems: 3
          maxItems: 5
          items: { $ref: '#/components/schemas/PairSeat' }
        baselineCaseId: { type: string, format: uuid, nullable: true }
        candidateCaseId: { type: string, format: uuid, nullable: true }
        baselineState: { $ref: '#/components/schemas/CaseState' }
        candidateState: { $ref: '#/components/schemas/CaseState' }
        reason:
          type: string
          enum: [ FAILED_COUNTERPART, UNFINISHED ]
          description: >-
            FAILED_COUNTERPART when a side failed or was cancelled; UNFINISHED when a side is still
            pending or running.
    PairedMetricDifference:
      type: object
      additionalProperties: false
      required: [ name, statistic, dimensions, unit, baselineValue, candidateValue, difference, status, interval ]
      properties:
        name: { type: string, minLength: 1 }
        statistic: { $ref: '#/components/schemas/MetricStatistic' }
        dimensions: { $ref: '#/components/schemas/MetricDimensions' }
        unit: { type: string, minLength: 1 }
        baselineValue: { type: number, nullable: true }
        candidateValue: { type: number, nullable: true }
        difference:
          type: number
          nullable: true
          description: Candidate minus baseline, both computed over matched blocks only.
        status: { $ref: '#/components/schemas/MetricStatus' }
        interval:
          allOf: [ { $ref: '#/components/schemas/ConfidenceInterval' } ]
          nullable: true
    ComparisonCohort:
      type: object
      additionalProperties: false
      required:
        - policyId
        - policyVersion
        - playerCount
        - factionSet
        - seatIndex
        - matchedBlocks
        - excludedBlocks
        - metricDifferences
      properties:
        policyId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        factionSet:
          allOf: [ { $ref: '#/components/schemas/FactionSet' } ]
          nullable: true
        seatIndex: { type: integer, minimum: 0, nullable: true }
        matchedBlocks:
          type: integer
          minimum: 0
          description: Seeds whose every pair in the cohort succeeded on both sides.
        excludedBlocks: { type: integer, minimum: 0 }
        metricDifferences:
          type: array
          items: { $ref: '#/components/schemas/PairedMetricDifference' }
    Comparison:
      type: object
      additionalProperties: false
      required:
        - formatVersion
        - comparisonId
        - baseline
        - candidate
        - declaredDifferences
        - analysisVersion
        - analysisSeed
        - complete
        - matchedBlocks
        - unmatchedCases
        - failedCounterparts
        - excludedPairs
        - cohorts
      properties:
        formatVersion:
          type: integer
          enum: [ 1 ]
          description: Version of the comparison's JSON and CSV layout; the first CSV column.
        comparisonId: { type: string, format: uuid }
        baseline: { $ref: '#/components/schemas/ComparisonSide' }
        candidate: { $ref: '#/components/schemas/ComparisonSide' }
        declaredDifferences:
          type: array
          items: { $ref: '#/components/schemas/DeclaredDifference' }
        analysisVersion: { type: string, minLength: 1 }
        analysisSeed: { $ref: '#/components/schemas/DecimalUint64' }
        complete:
          type: boolean
          description: False while any pair has a side that has not succeeded.
        matchedBlocks:
          type: integer
          minimum: 0
          description: Matched blocks summed over the pooled cohorts.
        unmatchedCases:
          type: integer
          minimum: 0
          description: Pairs with a pending or running side.
        failedCounterparts:
          type: integer
          minimum: 0
          description: Pairs with a failed or cancelled side.
        excludedPairs:
          type: array
          items: { $ref: '#/components/schemas/ExcludedPair' }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/ComparisonCohort' }

    ReplayPerspective:
      type: string
      enum: [ PLAYER, OBSERVER ]
    ReplayStep:
      type: object
      additionalProperties: false
      required: [ step, eraNumber, roundNumber, phase, logicalTime, observations, decision, acceptedResult ]
      properties:
        step: { type: integer, minimum: 0 }
        eraNumber: { type: integer, minimum: 1, nullable: true }
        roundNumber: { type: integer, minimum: 1, nullable: true }
        phase: { type: string, minLength: 1 }
        logicalTime: { type: string, format: date-time }
        observations: { type: object, additionalProperties: true, nullable: true }
        decision: { type: object, additionalProperties: true, nullable: true }
        acceptedResult: { type: object, additionalProperties: true, nullable: true }
    Replay:
      type: object
      additionalProperties: false
      required: [ caseId, manifestDigest, perspective, steps, nextStep ]
      properties:
        caseId: { type: string, format: uuid }
        manifestDigest: { $ref: '#/components/schemas/Sha256Digest' }
        perspective: { $ref: '#/components/schemas/ReplayPerspective' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ReplayStep' }
        nextStep: { type: integer, minimum: 0, nullable: true }

    Faction:
      $ref: '../shared/enums.yaml#/Faction'
    CardType:
      $ref: '../shared/enums.yaml#/CardType'
    CardGrade:
      $ref: '../shared/enums.yaml#/CardGrade'
    SpecialAction:
      $ref: '../shared/enums.yaml#/SpecialAction'
    ParadoxType:
      $ref: '../shared/enums.yaml#/ParadoxType'
    EffectiveRules:
      $ref: '../shared/effective-rules.yaml#/EffectiveRules'
    TerminalEndReason:
      type: string
      enum: [ WIN_CONDITION_MET, TIMELINE_COLLAPSED, TIMELINE_STABILIZED, DECK_EXHAUSTED, RESOLUTION_FAILED, ALL_PLAYERS_ABANDONED ]
      description: >-
        Mirrors the terminal-result vocabulary pinned by the manifest's participant/event contract versions.
    Winner:
      type: object
      additionalProperties: false
      required: [ seatIndex, faction, winType ]
      properties:
        seatIndex: { type: integer, minimum: 0 }
        faction: { $ref: '#/components/schemas/Faction' }
        winType:
          type: string
          nullable: true
          enum: [ SCORE_THRESHOLD, FACTION_OBJECTIVE, LAST_PLAYER_STANDING, null ]
          description: >-
            Always present, and null unless the ending is WIN_CONDITION_MET: the participant contract assigns a
            win type only to a normal victory, while the special endings (TIMELINE_COLLAPSED and
            TIMELINE_STABILIZED) decide their winners by highest score or by stabilization claims.
    FinalScore:
      type: object
      additionalProperties: false
      required: [ seatIndex, faction, score ]
      properties:
        seatIndex: { type: integer, minimum: 0 }
        faction: { $ref: '#/components/schemas/Faction' }
        score: { type: integer }
    ExperimentSummary:
      type: object
      additionalProperties: false
      required: [ experimentId, name, manifestDigest, createdAt ]
      properties:
        experimentId: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        manifestDigest: { $ref: '#/components/schemas/Sha256Digest' }
        createdAt: { type: string, format: date-time }
    ExperimentList:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExperimentSummary' }
        total: { type: integer, minimum: 0 }
    RunList:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Run' }
        total: { type: integer, minimum: 0 }
    CaseSummary:
      type: object
      additionalProperties: false
      required: [ caseId, caseKey, runId, variantLabel, seed, playerCount, state, endReason ]
      properties:
        caseId: { type: string, format: uuid }
        caseKey: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        variantLabel: { type: string, minLength: 1 }
        seed: { $ref: '#/components/schemas/DecimalUint64' }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        state: { $ref: '#/components/schemas/CaseState' }
        endReason:
          type: string
          nullable: true
          enum: [ WIN_CONDITION_MET, TIMELINE_COLLAPSED, TIMELINE_STABILIZED, DECK_EXHAUSTED, RESOLUTION_FAILED, ALL_PLAYERS_ABANDONED, null ]
          description: The case's ending cause; null until the case has a result.
    CaseList:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        total: { type: integer, minimum: 0 }
    ComparisonSummary:
      type: object
      additionalProperties: false
      description: >-
        Identifies a stored comparison without computing it; `getComparison` returns the result.
      required: [ comparisonId, baseline, candidate, analysisVersion, analysisSeed, createdAt ]
      properties:
        comparisonId: { type: string, format: uuid }
        baseline: { $ref: '#/components/schemas/ComparisonSide' }
        candidate: { $ref: '#/components/schemas/ComparisonSide' }
        analysisVersion: { type: string, minLength: 1 }
        analysisSeed: { $ref: '#/components/schemas/DecimalUint64' }
        createdAt: { type: string, format: date-time }
    ComparisonList:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ComparisonSummary' }
        total: { type: integer, minimum: 0 }
    PreviewBreakdown:
      type: object
      additionalProperties: false
      required: [ variantLabel, playerCount, caseCount ]
      properties:
        variantLabel: { type: string, minLength: 1 }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        caseCount: { type: integer, minimum: 0 }
    PreviewCase:
      type: object
      additionalProperties: false
      required: [ caseKey, variantLabel, seed, playerCount, assignments ]
      properties:
        caseKey: { type: string, format: uuid }
        variantLabel: { type: string, minLength: 1 }
        seed: { $ref: '#/components/schemas/DecimalUint64' }
        playerCount: { type: integer, enum: [ 3, 4, 5 ] }
        assignments:
          type: array
          minItems: 3
          maxItems: 5
          items: { $ref: '#/components/schemas/SeatAssignment' }
    ExperimentPreview:
      type: object
      additionalProperties: false
      required: [ manifestDigest, caseCount, breakdown, cases, limit, offset ]
      properties:
        manifestDigest: { $ref: '#/components/schemas/Sha256Digest' }
        caseCount: { type: integer, minimum: 0 }
        breakdown:
          type: array
          items: { $ref: '#/components/schemas/PreviewBreakdown' }
        cases:
          type: array
          items: { $ref: '#/components/schemas/PreviewCase' }
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
    PolicyBundle:
      type: object
      additionalProperties: false
      required: [ id, version, artifactDigest, description, parameters ]
      properties:
        id: { type: string, minLength: 1 }
        version: { type: string, minLength: 1 }
        artifactDigest: { $ref: '#/components/schemas/Sha256Digest' }
        description: { type: string, minLength: 1 }
        parameters:
          type: object
          additionalProperties: true
          description: The parameters the bundle accepts; empty when it accepts none.
    PolicyCatalog:
      type: object
      additionalProperties: false
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyBundle' }
    LaneBundle:
      type: object
      additionalProperties: false
      required:
        - rulesArtifact
        - contentArtifact
        - effectiveRulesDigest
        - effectiveContentDigest
        - services
        - contracts
        - laneCount
      description: >-
        One distinct bundle some configured lane serves: one pair of effective rules and content
        digests with the service provenance and contract versions of the lanes that serve it.
        `rulesArtifact` names the lane's baseline rules document and `effectiveRulesDigest` is that
        document's effective rules digest. Carries no lane identifier, URL, credential or bot
        identity. Lanes serving exactly this bundle are counted in `laneCount`, busy or free.
      properties:
        rulesArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        contentArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        effectiveRulesDigest: { $ref: '#/components/schemas/Sha256Digest' }
        effectiveContentDigest: { $ref: '#/components/schemas/Sha256Digest' }
        services: { $ref: '#/components/schemas/ServiceProvenanceMap' }
        contracts: { $ref: '#/components/schemas/ContractVersions' }
        laneCount:
          type: integer
          minimum: 1
    LaneBundlePage:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LaneBundle' }
        total: { type: integer, minimum: 0 }
    ExperimentDefaults:
      type: object
      additionalProperties: false
      required:
        - seeds
        - playerCounts
        - factionSets
        - seatRotationMode
        - timingMode
        - policies
        - concurrency
        - caseWallTimeoutSeconds
        - maxRejectedCandidatesPerWindow
      description: >-
        Complete defaults for every manifest field that does not identify a bundle, each with
        exactly the type and constraints it has in `ExperimentManifest`. A client assembles an
        `ExperimentManifest` from a template's defaults, the chosen bundles and the designer's
        edits for `createExperiment` or `previewExperiment`.
      properties:
        seeds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DecimalUint64' }
        playerCounts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [ 3, 4, 5 ]
        factionSets:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/FactionSet' }
          description: Every set's size must match a selected player count.
        seatRotationMode:
          type: string
          enum: [ CYCLIC ]
        timingMode:
          type: string
          enum: [ LOGICAL ]
        policies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Policy' }
        concurrency:
          type: integer
          minimum: 1
        caseWallTimeoutSeconds:
          type: integer
          minimum: 1
        maxRejectedCandidatesPerWindow:
          type: integer
          minimum: 1
    ExperimentTemplate:
      type: object
      additionalProperties: false
      required: [ templateId, name, description, variantCount, defaults ]
      description: >-
        A named starting point for the common experiment shapes, with complete defaults for every
        manifest field that does not identify a bundle.
      properties:
        templateId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        variantCount:
          type: integer
          minimum: 1
          description: Variants the template needs, each from a distinct bundle.
        defaults: { $ref: '#/components/schemas/ExperimentDefaults' }
    ExperimentTemplatePage:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExperimentTemplate' }
        total: { type: integer, minimum: 0 }
    AttemptFailureCode:
      type: string
      enum: [ RUNNER_TIMEOUT, EXECUTION_FAILED, CONTRACT_MISMATCH, CONFIGURATION_DRIFT, POLICY_EXHAUSTED ]
      description: >-
        Recorded attempt-failure code. A case's code is the code of its final failed attempt;
        retried attempts that later succeeded do not count.
    Band:
      type: object
      additionalProperties: false
      required: [ lower, upper, scale ]
      description: >-
        Closed interval `[lower, upper]`, or a one-sided limit (`>= lower` or `<= upper`) with
        the normalisation scale. At least one bound is present; `scale` (greater than 0) is
        required exactly when one bound is null.
      properties:
        lower: { type: number, nullable: true }
        upper: { type: number, nullable: true }
        scale:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
    CriterionDerivation:
      type: string
      enum: [ DIRECT, RATIO_TO_WIN_REFERENCE, SUM_OF_FAILURE_CODES ]
      description: >-
        How the line's value is derived: directly from one report metric, as a faction ratio to
        the win reference, or as a sum of several `failure_share` codes.
    CriterionPooling:
      type: string
      enum: [ POOLED, PER_FACTION_SET ]
    CriterionRole:
      type: string
      enum: [ GATE, SCORED ]
      description: >-
        `GATE` lines reject the configuration when they `FAIL`; `SCORED` lines contribute to the
        aggregate score.
    CriterionAggregation:
      type: string
      enum: [ WEIGHTED_SUM_OF_SQUARED_DEVIATIONS ]
    CriterionDimension:
      type: object
      additionalProperties: false
      required: [ eachFaction, endReason, quantile, failureCodes ]
      properties:
        eachFaction:
          type: boolean
          description: One line per faction when true.
        endReason:
          type: string
          nullable: true
          enum: [ WIN_CONDITION_MET, TIMELINE_COLLAPSED, TIMELINE_STABILIZED, DECK_EXHAUSTED, RESOLUTION_FAILED, ALL_PLAYERS_ABANDONED, null ]
          description: The line's end-reason dimension; null when the line is not split by it.
        quantile: { type: number, nullable: true }
        failureCodes:
          type: array
          nullable: true
          description: Used by `SUM_OF_FAILURE_CODES` derivations.
          items: { $ref: '#/components/schemas/AttemptFailureCode' }
    CriterionLine:
      type: object
      additionalProperties: false
      required: [ id, metric, derivation, dimension, policies, playerCounts, pooling, band, role, weight, rationale ]
      properties:
        id:
          type: string
          pattern: '^[GL]-[0-9]{2}$'
        metric:
          type: string
          minLength: 1
        derivation: { $ref: '#/components/schemas/CriterionDerivation' }
        dimension: { $ref: '#/components/schemas/CriterionDimension' }
        policies:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        playerCounts:
          type: array
          minItems: 1
          items: { type: integer, enum: [ 3, 4, 5 ] }
        pooling: { $ref: '#/components/schemas/CriterionPooling' }
        band: { $ref: '#/components/schemas/Band' }
        weight:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          description: Greater than 0 for `SCORED` lines; null for `GATE` lines.
        role: { $ref: '#/components/schemas/CriterionRole' }
        rationale:
          type: string
          minLength: 1
    CriterionEvidence:
      type: object
      additionalProperties: false
      required: [ confidenceLevel, executionFailedShareLimit, invalidatingFailureCodes, invalidatingEndReasons, confirmationMinimumSeeds ]
      properties:
        confidenceLevel: { type: number, enum: [ 0.95 ] }
        executionFailedShareLimit: { type: number }
        invalidatingFailureCodes:
          type: array
          items: { $ref: '#/components/schemas/AttemptFailureCode' }
        invalidatingEndReasons:
          type: array
          items: { $ref: '#/components/schemas/TerminalEndReason' }
        confirmationMinimumSeeds:
          type: integer
          minimum: 2
    BalanceCriterion:
      type: object
      additionalProperties: false
      required: [ version, digest, title, analysisVersion, lines, aggregation, evidence ]
      description: >-
        One read-only balance criterion version served from the workbench's configuration.
      properties:
        version:
          type: integer
          minimum: 1
        digest: { $ref: '#/components/schemas/Sha256Digest' }
        title:
          type: string
          minLength: 1
        analysisVersion:
          type: string
          minLength: 1
        lines:
          type: array
          items: { $ref: '#/components/schemas/CriterionLine' }
        aggregation: { $ref: '#/components/schemas/CriterionAggregation' }
        evidence: { $ref: '#/components/schemas/CriterionEvidence' }
    BalanceCriterionCatalog:
      type: object
      additionalProperties: false
      required: [ criteria ]
      properties:
        criteria:
          type: array
          items: { $ref: '#/components/schemas/BalanceCriterion' }
    EvaluationMode:
      type: string
      enum: [ SCREENING, CONFIRMATION ]
    EvaluationVerdict:
      type: string
      enum: [ REJECTED, CONFIRMED, UNCONFIRMED, INVALID ]
    LineVerdict:
      type: string
      enum: [ MEETS, FAILS, INCONCLUSIVE ]
      description: >-
        `MEETS` when the interval lies inside the band; `FAILS` when it lies wholly outside;
        `INCONCLUSIVE` otherwise, and always when the status is `INSUFFICIENT_SAMPLE` or
        `NO_DATA`.
    ValidityReasonCode:
      type: string
      enum: [ UNFINISHED_CASES, CONTRACT_MISMATCH, CONFIGURATION_DRIFT, EXECUTION_FAILED_SHARE, ALL_PLAYERS_ABANDONED ]
    EvaluationValidityReason:
      type: object
      additionalProperties: false
      required: [ code, detail ]
      properties:
        code: { $ref: '#/components/schemas/ValidityReasonCode' }
        detail:
          type: string
          minLength: 1
    EvaluationValidity:
      type: object
      additionalProperties: false
      required: [ valid, reasons ]
      properties:
        valid: { type: boolean }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/EvaluationValidityReason' }
    ConfirmationSample:
      type: object
      additionalProperties: false
      required: [ requiredSeeds, seeds, fullMatrix, satisfied ]
      description: >-
        The confirmation sample: at least the criterion's minimum seeds and the full case
        matrix with every policy the criterion names.
      properties:
        requiredSeeds:
          type: integer
          minimum: 0
        seeds:
          type: integer
          minimum: 0
        fullMatrix: { type: boolean }
        satisfied: { type: boolean }
    EvaluatedLineDimensions:
      type: object
      additionalProperties: false
      description: >-
        What the evaluated line is restricted to: the report metric dimensions plus the
        `failureCodes` summed by a `SUM_OF_FAILURE_CODES` derivation. An absent property means
        the line is not split by it.
      properties:
        faction: { $ref: '#/components/schemas/Faction' }
        cardType: { $ref: '#/components/schemas/CardType' }
        cardGrade: { $ref: '#/components/schemas/CardGrade' }
        specialAction: { $ref: '#/components/schemas/SpecialAction' }
        paradoxType: { $ref: '#/components/schemas/ParadoxType' }
        endReason:
          type: string
          nullable: true
          enum: [ WIN_CONDITION_MET, TIMELINE_COLLAPSED, TIMELINE_STABILIZED, DECK_EXHAUSTED, RESOLUTION_FAILED, ALL_PLAYERS_ABANDONED, null ]
        quantile: { type: number, nullable: true }
        failureCode: { $ref: '#/components/schemas/AttemptFailureCode' }
        failureCodes:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/AttemptFailureCode' }
    EvaluatedLine:
      type: object
      additionalProperties: false
      required: [ lineId, role, metric, dimensions, policyId, playerCount, factionSet, band, value, interval, status, deviation, verdict, weight ]
      description: >-
        One criterion line expanded for one cohort and dimension value. Deviation `d` is 0
        inside the band; outside it `(lower - value) / w` or `(value - upper) / w`, where
        `w` is the band width for a two-sided band and `scale` for a one-sided limit. A
        `NO_DATA` line has `d = 0`.
      properties:
        lineId:
          type: string
          minLength: 1
        role: { $ref: '#/components/schemas/CriterionRole' }
        metric:
          type: string
          minLength: 1
        dimensions: { $ref: '#/components/schemas/EvaluatedLineDimensions' }
        policyId:
          type: string
          minLength: 1
        playerCount:
          type: integer
          enum: [ 3, 4, 5 ]
        factionSet:
          allOf: [ { $ref: '#/components/schemas/FactionSet' } ]
          nullable: true
        band: { $ref: '#/components/schemas/Band' }
        value: { type: number, nullable: true }
        interval:
          allOf: [ { $ref: '#/components/schemas/ConfidenceInterval' } ]
          nullable: true
        status: { $ref: '#/components/schemas/MetricStatus' }
        deviation:
          type: number
          minimum: 0
        verdict: { $ref: '#/components/schemas/LineVerdict' }
        weight:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
    RunEvaluation:
      type: object
      additionalProperties: false
      required: [ runId, variantLabel, criterionVersion, criterionDigest, analysisVersion, analysisSeed, mode, validity, verdict, score, confirmationSample, lines ]
      description: >-
        The derived evaluation of one run variant against one criterion version. Score is the
        sum of `weight x deviation^2` over the `SCORED` lines; it is null when the evaluation
        is `INVALID`.
      properties:
        runId: { type: string, format: uuid }
        variantLabel:
          type: string
          minLength: 1
        criterionVersion:
          type: integer
          minimum: 1
        criterionDigest: { $ref: '#/components/schemas/Sha256Digest' }
        analysisVersion:
          type: string
          minLength: 1
        analysisSeed: { $ref: '#/components/schemas/DecimalUint64' }
        mode: { $ref: '#/components/schemas/EvaluationMode' }
        validity: { $ref: '#/components/schemas/EvaluationValidity' }
        verdict: { $ref: '#/components/schemas/EvaluationVerdict' }
        score:
          type: number
          nullable: true
        confirmationSample:
          allOf: [ { $ref: '#/components/schemas/ConfirmationSample' } ]
          nullable: true
        lines:
          type: array
          items: { $ref: '#/components/schemas/EvaluatedLine' }
    ParameterSpaceCatalog:
      type: object
      additionalProperties: false
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ParameterSpace' }
    ParameterSpace:
      type: object
      additionalProperties: false
      required: [ version, parameters, derived, constraints, heldFixed ]
      properties:
        version: { type: integer, minimum: 1 }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ParameterDefinition' }
        derived:
          type: array
          items: { $ref: '#/components/schemas/DerivedParameter' }
        constraints:
          type: array
          items: { $ref: '#/components/schemas/ParameterConstraint' }
        heldFixed:
          type: array
          items: { $ref: '#/components/schemas/HeldFixedParameter' }
    ParameterDefinition:
      type: object
      additionalProperties: false
      required: [ key, services, baseline, min, max, step ]
      properties:
        key: { type: string, minLength: 1 }
        services:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        baseline: { type: number }
        min: { type: number }
        max: { type: number }
        step: { type: number }
    DerivedParameter:
      type: object
      additionalProperties: false
      required: [ key, from, factor ]
      description: A derived value whose `key` always equals `factor` times `from`.
      properties:
        key: { type: string, minLength: 1 }
        from: { type: string, minLength: 1 }
        factor: { type: number }
    ParameterConstraint:
      type: object
      additionalProperties: false
      required: [ id, expression, description ]
      properties:
        id: { type: string, minLength: 1 }
        expression: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
    HeldFixedParameter:
      type: object
      additionalProperties: false
      required: [ key, reason ]
      properties:
        key: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
    VariantRulesPreviewRequest:
      type: object
      additionalProperties: false
      required: [ rulesArtifact, parameterSpaceVersion, overrides ]
      properties:
        rulesArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        parameterSpaceVersion: { type: integer, minimum: 1 }
        overrides:
          type: object
          additionalProperties: { type: number }
    VariantRulesPreview:
      type: object
      additionalProperties: false
      required: [ rules, effectiveRulesDigest, overrides ]
      properties:
        rules: { $ref: '#/components/schemas/EffectiveRules' }
        effectiveRulesDigest: { $ref: '#/components/schemas/Sha256Digest' }
        overrides:
          type: object
          additionalProperties: { type: number }
          description: The normalised overrides, with baseline-equal values removed, as freezing would store them.

    CampaignBaseline:
      type: object
      additionalProperties: false
      required: [ rulesArtifact, contentArtifact ]
      description: Baseline rules and content every candidate of a campaign builds on.
      properties:
        rulesArtifact: { $ref: '#/components/schemas/ArtifactReference' }
        contentArtifact: { $ref: '#/components/schemas/ArtifactReference' }
    SearchAlgorithm:
      type: object
      additionalProperties: false
      required: [ version, initialCandidates, screeningSeeds, eta, shortListSize ]
      properties:
        version:
          type: string
          enum: [ SUCCESSIVE_HALVING_V1 ]
        initialCandidates:
          type: integer
          minimum: 2
          description: Candidates generated from the baseline and its parameter space.
        screeningSeeds:
          type: integer
          minimum: 2
          description: Seeds each candidate is screened on before a keep-or-discard decision.
        eta:
          type: integer
          minimum: 2
          description: Fraction 1/eta of survivors kept after each round.
        shortListSize:
          type: integer
          minimum: 1
          description: Candidates confirmed on fresh seeds.
    CampaignDefinition:
      type: object
      additionalProperties: false
      required:
        - name
        - baseline
        - parameterSpaceVersion
        - criterionVersion
        - policies
        - playerCounts
        - searchMasterSeed
        - confirmationMasterSeed
        - algorithm
      description: >-
        The frozen inputs of a configuration search. `policies` use the same shape as an
        `ExperimentManifest` policy. A definition whose `searchMasterSeed` and
        `confirmationMasterSeed` are equal is refused.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseline: { $ref: '#/components/schemas/CampaignBaseline' }
        parameterSpaceVersion:
          type: integer
          minimum: 1
        criterionVersion:
          type: integer
          minimum: 1
        policies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Policy' }
        playerCounts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [ 3, 4, 5 ]
        budgetSeconds:
          type: integer
          minimum: 60
          default: 14400
          description: Active compute time the search may spend; four hours by default.
        parallelism:
          type: integer
          minimum: 1
          default: 4
          description: Games played at once; may be changed while the campaign runs.
        searchMasterSeed:
          allOf: [ { $ref: '#/components/schemas/DecimalUint64' } ]
          description: Derives every search seed.
        confirmationMasterSeed:
          allOf: [ { $ref: '#/components/schemas/DecimalUint64' } ]
          description: Derives every confirmation seed and must differ from `searchMasterSeed`.
        algorithm: { $ref: '#/components/schemas/SearchAlgorithm' }
    CampaignState:
      type: string
      enum: [ QUEUED, RUNNING, PAUSED, SEARCH_COMPLETED, CONFIRMING, COMPLETED, CANCELLED, FAILED ]
      description: >-
        `QUEUED` accepted and not yet started; `RUNNING` spending budget; `PAUSED` stopped by the
        designer and resumable; `SEARCH_COMPLETED` budget spent or short list stable, with the short
        list available; `CONFIRMING` confirmation runs in progress; `COMPLETED` confirmation
        evaluated; `CANCELLED` cancelled by the designer; `FAILED` stopped by an error, which
        `failure` holds.
    Campaign:
      type: object
      additionalProperties: false
      required:
        - campaignId
        - name
        - baseline
        - parameterSpaceVersion
        - criterionVersion
        - policies
        - playerCounts
        - budgetSeconds
        - parallelism
        - searchMasterSeed
        - confirmationMasterSeed
        - algorithm
        - state
        - spentSeconds
        - round
        - shortList
        - confirmation
        - failure
        - createdAt
        - startedAt
        - finishedAt
      description: >-
        One configuration search campaign: its frozen definition plus its current state.
        `spentSeconds` is active compute time; `parallelism` is the current value and may change
        while the campaign runs; `shortList` stays empty until `SEARCH_COMPLETED`; `confirmation`
        is null until started.
      properties:
        campaignId: { type: string, format: uuid }
        name:
          type: string
          minLength: 1
          maxLength: 120
        baseline: { $ref: '#/components/schemas/CampaignBaseline' }
        parameterSpaceVersion:
          type: integer
          minimum: 1
        criterionVersion:
          type: integer
          minimum: 1
        policies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Policy' }
        playerCounts:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [ 3, 4, 5 ]
        budgetSeconds:
          type: integer
          minimum: 60
          description: Active compute time the search may spend.
        parallelism:
          type: integer
          minimum: 1
          description: Current number of games played at once.
        searchMasterSeed:
          allOf: [ { $ref: '#/components/schemas/DecimalUint64' } ]
          description: Derives every search seed.
        confirmationMasterSeed:
          allOf: [ { $ref: '#/components/schemas/DecimalUint64' } ]
          description: Derives every confirmation seed and must differ from `searchMasterSeed`.
        algorithm: { $ref: '#/components/schemas/SearchAlgorithm' }
        state: { $ref: '#/components/schemas/CampaignState' }
        spentSeconds:
          type: integer
          minimum: 0
          description: Active compute time spent so far.
        round:
          type: integer
          minimum: 0
        shortList:
          type: array
          items: { type: string, minLength: 1 }
          description: Short-listed candidate ids, empty until `SEARCH_COMPLETED`.
        confirmation:
          allOf: [ { $ref: '#/components/schemas/CampaignConfirmation' } ]
          nullable: true
        failure:
          allOf: [ { $ref: '#/components/schemas/CampaignFailure' } ]
          nullable: true
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    CampaignFailure:
      type: object
      additionalProperties: false
      required: [ code, message ]
      description: Why a campaign stopped with state `FAILED`.
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
    CampaignList:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Campaign' }
        total: { type: integer, minimum: 0 }
    CampaignEvaluation:
      type: object
      additionalProperties: false
      required: [ verdict, score ]
      description: The compact evaluation of one candidate that drove a log decision.
      properties:
        verdict: { $ref: '#/components/schemas/EvaluationVerdict' }
        score: { type: number, nullable: true }
    CampaignLogDecision:
      type: string
      enum: [ GENERATED, KEPT, DISCARDED, SHORT_LISTED ]
    CampaignLogReason:
      type: string
      enum: [ GATE_FAILS, DOMINATED, NOT_IN_TOP_FRACTION, BUDGET_EXHAUSTED ]
    CampaignLogEvidence:
      type: object
      additionalProperties: false
      description: >-
        Why a decision was taken. `lineIds` lists the failing criterion lines for `GATE_FAILS`;
        `dominatedBy` names the dominating candidate for `DOMINATED`.
      properties:
        lineIds:
          type: array
          items: { type: string, minLength: 1 }
        dominatedBy:
          type: string
          minLength: 1
    CampaignLogEntry:
      type: object
      additionalProperties: false
      required:
        - sequence
        - round
        - candidateId
        - overrides
        - effectiveRulesDigest
        - seeds
        - gamesSpent
        - evaluation
        - decision
        - reason
        - evidence
      properties:
        sequence:
          type: integer
          minimum: 1
          description: Decision order within the campaign, starting at 1.
        round:
          type: integer
          minimum: 0
        candidateId: { type: string, minLength: 1 }
        overrides:
          type: object
          additionalProperties: { type: number }
        effectiveRulesDigest: { $ref: '#/components/schemas/Sha256Digest' }
        seeds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/DecimalUint64' }
          description: Seeds played for this candidate so far.
        gamesSpent:
          type: integer
          minimum: 0
        evaluation:
          allOf: [ { $ref: '#/components/schemas/CampaignEvaluation' } ]
          nullable: true
        decision: { $ref: '#/components/schemas/CampaignLogDecision' }
        reason:
          allOf: [ { $ref: '#/components/schemas/CampaignLogReason' } ]
          nullable: true
        evidence:
          allOf: [ { $ref: '#/components/schemas/CampaignLogEvidence' } ]
          nullable: true
    CampaignLogPage:
      type: object
      additionalProperties: false
      required: [ items, total ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CampaignLogEntry' }
        total: { type: integer, minimum: 0 }
    ConfirmationRun:
      type: object
      additionalProperties: false
      required: [ candidateId, experimentId, runId, evaluation ]
      properties:
        candidateId:
          type: string
          minLength: 1
          description: The short-listed candidate id, or the literal `baseline` for the baseline run.
        experimentId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        evaluation:
          allOf: [ { $ref: '#/components/schemas/CampaignEvaluation' } ]
          nullable: true
          description: Null until the confirmation run has an evaluation.
    CampaignConfirmation:
      type: object
      additionalProperties: false
      required: [ seedCount, runs, seedOverlap ]
      description: >-
        One confirmation run per short-listed candidate and one for the baseline. Confirmation
        seeds derive from `confirmationMasterSeed` only.
      properties:
        seedCount:
          type: integer
          minimum: 2
          description: The criterion's `confirmationMinimumSeeds`.
        runs:
          type: array
          items: { $ref: '#/components/schemas/ConfirmationRun' }
        seedOverlap:
          type: boolean
          description: Always false for an accepted confirmation.
    CampaignParallelismUpdate:
      type: object
      additionalProperties: false
      required: [ parallelism ]
      properties:
        parallelism: { type: integer, minimum: 1 }
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [ type, title, status, code ]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
        field:
          type: string
          minLength: 1
          description: >-
            Path of the offending manifest, campaign definition or request value, such as `seeds`,
            `policies[0].seatAssignment`, `variants[1].overrides.game.rules.win-score-threshold`, or
            `confirmationMasterSeed`. Present on `INVALID_EXPERIMENT`, `INVALID_CAMPAIGN`, `INVALID_REQUEST` and
            `MANIFEST_MISMATCH` when the refusal is attributable to one value; absent otherwise.
        reason:
          type: string
          enum:
            - UNKNOWN_PARAMETER_SPACE
            - UNKNOWN_BASELINE
            - UNKNOWN_PARAMETER
            - OUT_OF_RANGE
            - OFF_STEP
            - CONSTRAINT_VIOLATED
            - UNKNOWN_CRITERION
            - EQUAL_MASTER_SEEDS
            - INVALID_VALUE
          description: >-
            Why a variant's overrides or a campaign definition were refused. Present on variant-rule
            and campaign refusals; absent otherwise. `UNKNOWN_PARAMETER_SPACE` and `UNKNOWN_BASELINE`
            apply to both; `UNKNOWN_PARAMETER`, `OUT_OF_RANGE`, `OFF_STEP` and `CONSTRAINT_VIOLATED`
            apply to variant overrides; `UNKNOWN_CRITERION`, `EQUAL_MASTER_SEEDS` and `INVALID_VALUE`
            apply to campaign definitions.
        constraintId:
          type: string
          minLength: 1
          description: >-
            The violated parameter space constraint. Present only when `reason` is `CONSTRAINT_VIOLATED`.
        code:
          type: string
          enum:
            - INVALID_EXPERIMENT
            - INVALID_REPLAY_PERSPECTIVE
            - INVALID_COMPARISON
            - IDEMPOTENCY_CONFLICT
            - EXPERIMENT_IMMUTABLE
            - INVALID_RUN_STATE
            - MANIFEST_MISMATCH
            - INCOMPARABLE_RUNS
            - INVALID_REQUEST
            - INVALID_CAMPAIGN
            - INVALID_CAMPAIGN_STATE
            - SEED_OVERLAP
            - UNAUTHORIZED
            - INSUFFICIENT_SCOPE
            - RESOURCE_NOT_FOUND
