openapi: 3.0.3
info:
  title: Temporal Rift — Simulation Control API
  description: |
    Operator-only controls for reproducible execution in an isolated simulation deployment.
    The game, timeline and read services each expose this contract and own independent execution
    revisions and checkpoints. The caller coordinates the services and downstream projection
    barriers; an acknowledgement from one service does not imply global completion. read-service
    owns no timers: advancing its logical clock only moves its logical time, and a caller is not
    required to advance it.
    A service executes one game per execution context: the operator opens a context carrying
    that game's effective rules, plays it, and closes it before opening the next one. No
    restart is needed between games. While a context is open, an inbound event whose `gameId`
    is not the open context's game is consumed and ignored, and its offset still advances the
    source watermarks; with no context open every inbound event is ignored the same way, so a
    late event of a closed game never reaches the next game.
  version: 2.1.0

servers:
  - url: /

security:
  - bearerAuth: [ ]

tags:
  - name: Simulation execution

paths:
  /internal/simulation/v1/execution:
    put:
      tags: [ Simulation execution ]
      operationId: configureSimulationExecution
      description: |
        Opens the execution context for one game. With no context open, the context is accepted,
        its revision starts at 0 and its logical time is the context's `logicalTime`. Repeating an
        identical context is a no-op returning the current checkpoint; any other context while one
        is open is rejected. With no context open, when the service still holds gameplay state of an
        earlier context, it opens nothing and answers `409 EXECUTION_STATE_NOT_CLEAN`. A `caseKey`
        closed earlier may be opened again: its game is played as a new game with the same identity,
        and records already in the event source when it was closed never reach it. The service
        recomputes the canonical digest of `rules.properties` and validates the rules it uses for the
        context's game. This route is registered only in an isolated simulation deployment and
        requires `simulation:control`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionContext'
      responses:
        '200':
          description: Current checkpoint; initial accepted configuration has revision 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCheckpoint'
        '400':
          $ref: '#/components/responses/InvalidExecutionContext'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/SimulationControlForbidden'
        '404':
          $ref: '#/components/responses/SimulationControlUnavailable'
        '409':
          $ref: '#/components/responses/ExecutionContextConflict'
    delete:
      tags: [ Simulation execution ]
      operationId: closeSimulationExecution
      description: |
        Closes the open execution context for `caseKey` in any state (`READY`, `ACTIVE` or
        `TERMINAL`) so the service can accept the next game without restarting. On close, every
        pending outbox record, continuation and due timer of that context is discarded and never
        acts, and the context's game never changes again. Every other gameplay state of the context
        is discarded as well: the game's projections and idempotency claims, and the request rate
        counters of the context's participants. After a close the service behaves for the next
        context exactly as a newly started service. Repeating the close for the most recently
        closed `caseKey` is a no-op. This route is registered only in an isolated simulation
        deployment and requires `simulation:control`.
      parameters:
        - name: caseKey
          in: query
          required: true
          description: Case key of the context to close.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The context is closed, or the most recently closed `caseKey` was repeated.
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/SimulationControlForbidden'
        '404':
          $ref: '#/components/responses/SimulationControlUnavailable'
        '409':
          $ref: '#/components/responses/ExecutionCloseConflict'

  /internal/simulation/v1/checkpoint:
    get:
      tags: [ Simulation execution ]
      operationId: getSimulationCheckpoint
      description: |
        Reads this service's execution checkpoint. A drained checkpoint means all work observed up
        to its listed source/group watermarks has completed; it does not preclude unseen upstream
        work from arriving later.
      responses:
        '200':
          description: The current service-owned checkpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCheckpoint'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/SimulationControlForbidden'
        '404':
          $ref: '#/components/responses/SimulationControlUnavailable'
        '409':
          $ref: '#/components/responses/ExecutionNotConfigured'

  /internal/simulation/v1/clock:
    put:
      tags: [ Simulation execution ]
      operationId: advanceSimulationClock
      description: |
        Advances only this service's logical clock. Equal-time advances are legal idempotent
        operations. The caller must advance the services it needs and wait for their resulting
        barriers; read-service has no timers, so advancing it only moves its logical time and a
        caller is not required to advance it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockAdvance'
      responses:
        '200':
          description: The acknowledgement for this operation identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockAcknowledgement'
        '400':
          $ref: '#/components/responses/InvalidClockAdvance'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/SimulationControlForbidden'
        '404':
          $ref: '#/components/responses/SimulationControlUnavailable'
        '409':
          $ref: '#/components/responses/ClockAdvanceConflict'
        '422':
          $ref: '#/components/responses/ClockRegression'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A JWT Bearer token containing the `simulation:control` scope.

  responses:
    InvalidExecutionContext:
      description: "The execution context is malformed (`code: INVALID_EXECUTION_CONTEXT`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidClockAdvance:
      description: "The clock advance is malformed (`code: INVALID_CLOCK_ADVANCE`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AuthenticationRequired:
      description: "Missing, invalid, or expired bearer token (`code: AUTHENTICATION_REQUIRED`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SimulationControlForbidden:
      description: |
        The caller is authenticated but lacks `simulation:control`
        (`code: SIMULATION_CONTROL_FORBIDDEN`). Participant credentials receive this response
        without disclosing execution context.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    SimulationControlUnavailable:
      description: |
        The control interface is not registered in this deployment
        (`code: SIMULATION_CONTROL_UNAVAILABLE`). Ordinary deployments return this response even
        to a control-scoped caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ExecutionContextConflict:
      description: |
        A different context is already open (`code: EXECUTION_CONTEXT_CONFLICT`), or no context is
        open while the service still holds gameplay state of an earlier context
        (`code: EXECUTION_STATE_NOT_CLEAN`). In both cases nothing is opened.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ExecutionStateNotClean:
      description: |
        No context is open, but the service still holds gameplay state of an earlier context
        (`code: EXECUTION_STATE_NOT_CLEAN`). Nothing is opened; the caller discards that state by
        closing the earlier context before retrying.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ExecutionCloseConflict:
      description: |
        No context is open and none was ever closed (`code: EXECUTION_NOT_CONFIGURED`), or the
        `caseKey` matches neither the open nor the most recently closed context (`code:
        EXECUTION_CONTEXT_CONFLICT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ExecutionNotConfigured:
      description: "No execution has been configured (`code: EXECUTION_NOT_CONFIGURED`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ClockAdvanceConflict:
      description: |
        The operation identifier has a different body (`code: IDEMPOTENCY_CONFLICT`) or the
        expected revision is stale (`code: STALE_EXECUTION_REVISION`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ClockRegression:
      description: "The target time precedes the current logical time (`code: CLOCK_REGRESSION`)."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ExecutionContext:
      type: object
      additionalProperties: false
      required:
        [ schemaVersion, caseKey, seed, entropyVersion, manifestDigest, logicalTime, rules, rulesDigest, seats ]
      description: |
        The deterministic inputs and effective rules for one game. The service recomputes the
        canonical digest of `rules.properties` and rejects a mismatch. Every rules key must start
        with `game.rules.`; the service reads every rule it uses for this context's game, ignores
        keys it does not use, and rejects a missing or invalid used value with `detail` naming the
        key. The context is opened when none is open; an identical repeat is a no-op and any other
        context while one is open is a conflict.
      properties:
        schemaVersion:
          type: integer
          format: int32
          enum: [ 1 ]
        caseKey:
          type: string
          format: uuid
        seed:
          type: string
          format: uint64
          minLength: 1
          maxLength: 20
          pattern: '^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)$'
          description: Unsigned 64-bit decimal integer from 0 through 18446744073709551615.
        entropyVersion:
          type: string
          enum: [ SHA256_V1 ]
        manifestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase SHA-256 hex digest of the immutable execution manifest.
        rules:
          $ref: '#/components/schemas/EffectiveRules'
        rulesDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase hex SHA-256 of the UTF-8 bytes of the RFC 8785 (JSON Canonicalization
            Scheme) serialisation of `rules.properties`. The service recomputes it and rejects a
            mismatch.
        logicalTime:
          type: string
          format: date-time
          description: UTC logical time in RFC 3339 form; responses use the Z offset.
        seats:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: '#/components/schemas/SimulationSeat'
          description: |
            Ordered seat assignments. Validation requires contiguous seat indices and unique player
            IDs and factions. Player IDs identify existing authenticated bot subjects.
      example:
        schemaVersion: 1
        caseKey: 6f3f2a52-4f0a-4c69-9a39-2a8f0e2b9d11
        seed: '42'
        entropyVersion: SHA256_V1
        manifestDigest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        rules:
          schemaVersion: 1
          properties:
            game.rules.probability.amplify-multiplier.II: 2
            game.rules.win-score-threshold: 20
        rulesDigest: 2f4e77d6f2f5ad41eb3b05de091e524133995ef6f274a58f539adbf2d5b06fad
        logicalTime: '2026-10-05T19:00:00Z'
        seats:
          - seatIndex: 0
            playerId: 0d9b6f5e-1f4a-4c62-9a3c-2d8f0e2b9d11
            faction: ERASERS
          - seatIndex: 1
            playerId: 1e8c7a6f-2b5a-4d73-8b4d-3e9f1a3c5d22
            faction: WEAVERS
          - seatIndex: 2
            playerId: 2f9d8b7a-3c6b-4e84-9c5e-4fa02b4d6f33
            faction: PROPHETS

    SimulationSeat:
      type: object
      additionalProperties: false
      required: [ seatIndex, playerId, faction ]
      properties:
        seatIndex:
          type: integer
          format: int32
          minimum: 0
          maximum: 4
        playerId:
          type: string
          format: uuid
        faction:
          $ref: '../shared/enums.yaml#/Faction'

    ExecutionCheckpoint:
      type: object
      additionalProperties: false
      required:
        [ caseKey, manifestDigest, rulesDigest, revision, logicalTime, gameId, state, drained,
          outboxPending, continuationsPending, dueTimersPending, nextDeadline, sourceWatermarks ]
      properties:
        caseKey:
          type: string
          format: uuid
        manifestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        rulesDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Digest of the open context's rules.
        revision:
          type: integer
          format: int64
          minimum: 0
        logicalTime:
          type: string
          format: date-time
          description: The service logical time in UTC (Z offset).
        gameId:
          type: string
          format: uuid
          nullable: true
        state:
          $ref: '#/components/schemas/ExecutionState'
        drained:
          type: boolean
        outboxPending:
          type: integer
          format: int32
          minimum: 0
        continuationsPending:
          type: integer
          format: int32
          minimum: 0
        dueTimersPending:
          type: integer
          format: int32
          minimum: 0
        nextDeadline:
          type: string
          format: date-time
          description: Earliest unhandled deadline after the logical time, in UTC (Z offset).
          nullable: true
        sourceWatermarks:
          type: array
          items:
            $ref: '#/components/schemas/SourceWatermark'
          description: Per-source/group watermarks; these do not define a global event order.

    ExecutionState:
      type: string
      enum: [ READY, ACTIVE, TERMINAL ]

    SourceWatermark:
      type: object
      additionalProperties: false
      required: [ groupId, topic, partition, nextOffset ]
      properties:
        groupId:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
        partition:
          type: integer
          format: int32
          minimum: 0
        nextOffset:
          type: integer
          format: int64
          minimum: 0

    ClockAdvance:
      type: object
      additionalProperties: false
      required: [ operationId, expectedRevision, targetTime ]
      properties:
        operationId:
          type: string
          format: uuid
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        targetTime:
          type: string
          format: date-time
          description: |
            UTC logical time in RFC 3339 form; responses use the Z offset. Equal to the current
            time is a legal idempotent advance.

    ClockAcknowledgement:
      type: object
      additionalProperties: false
      required: [ operationId, appliedRevision, logicalTime ]
      properties:
        operationId:
          type: string
          format: uuid
        appliedRevision:
          type: integer
          format: int64
          minimum: 0
        logicalTime:
          type: string
          format: date-time
          description: The logical time the acknowledged operation set, in UTC (Z offset).

    EffectiveRules:
      $ref: '../shared/effective-rules.yaml#/EffectiveRules'

    ProblemDetail:
      type: object
      required: [ code ]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: string
          minLength: 1
